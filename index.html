<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO7010 Safety PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- SheetJS 用於 Excel 匯出 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Html5-Qrcode 用於 QR 掃描 -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/min/html5-qrcode.min.js"></script>
</head>
<body>
    <!-- 標頭：支援長按 3 秒開啟審批 Modal -->
    <header id="main-header">
        <h1 data-i18n="app_title">ISO7010 安全標誌系統</h1>
        <div class="header-controls">
            <select id="lang-select">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
            </select>
            <button id="export-btn" data-i18n="export_excel">匯出 Excel</button>
            <span id="pending-badge" class="badge" title="待審批數量">0</span>
        </div>
    </header>

    <!-- 主要操作區 -->
    <main>
        <!-- 搜尋與模式切換 -->
        <section class="control-section">
            <input type="text" id="search-input" placeholder="輸入關鍵字搜尋標誌..." data-i18n-placeholder="search_placeholder">
            <div class="mode-buttons">
                <button id="mode-db" class="active" data-i18n="mode_db">資料庫模式</button>
                <button id="mode-qr" data-i18n="mode_qr">QR 掃描模式</button>
                <button id="back-to-categories" style="display:none;" data-i18n="back_categories">返回分類</button>
            </div>
        </section>

        <!-- QR 掃描器容器 -->
        <section id="qr-reader-section" style="display: none;">
            <div id="reader"></div>
        </section>

        <!-- 標誌列表展示區 -->
        <section id="signs-container" class="signs-grid">
            <!-- 動態載入分類、標誌與詳細條列 -->
        </section>
    </main>

    <!-- 編輯危害控制 Modal (支援動態多語系標籤與可編輯欄位) -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" id="close-edit-modal">&times;</span>
            <h2 id="edit-modal-title" data-i18n="edit_title">編輯危害控制</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-sign-id">
                <div class="form-group">
                    <label id="lbl-risk-level">Risk Level (唯讀): <input type="text" id="edit-risk-level" readonly style="background-color:#e2e8f0; cursor:not-allowed;"></label>
                </div>
                <div class="form-group"><label id="lbl-freq">Freq: <input type="text" id="val-freq" class="editable-field"></label></div>
                <div class="form-group"><label id="lbl-elim">Elim: <input type="text" id="val-elim" class="editable-field"></label></div>
                <div class="form-group"><label id="lbl-sub">Sub: <input type="text" id="val-sub" class="editable-field"></label></div>
                <div class="form-group"><label id="lbl-eng">Eng: <input type="text" id="val-eng" class="editable-field"></label></div>
                <div class="form-group"><label id="lbl-admin">Admin: <input type="text" id="val-admin" class="editable-field"></label></div>
                <div class="form-group"><label id="lbl-ppe">PPE: <input type="text" id="val-ppe" class="editable-field"></label></div>
                <div class="form-group"><label id="lbl-applicant">申請人 (Applicant): <input type="text" id="val-applicant" required></label></div>
                <button type="submit" data-i18n="submit_approval">提交審批</button>
            </form>
        </div>
    </div>

    <!-- 審批 Modal (Header 長按 3 秒開啟) -->
    <div id="approval-modal" class="modal" style="display: none;">
        <div class="modal-content wide">
            <span class="close-btn" id="close-approval-modal">&times;</span>
            <h2 data-i18n="approval_title">待審批清單</h2>
            <div id="approval-list-container">
                <!-- 動態載入待審批項目 -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
