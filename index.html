<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO7010 Safety PWA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 頂部 Header (支援長按 3 秒開啟審批) -->
    <header id="main-header">
        <h1>ISO7010 安全標誌與危害控制系統</h1>
        <div id="header-controls">
            <span id="pending-badge" style="display:none; background:red; color:white; padding:4px 8px; border-radius:4px; cursor:pointer;"></span>
            <button id="scan-qr-btn">掃描 QR Code</button>
        </div>
    </header>

    <!-- 主畫面容器 -->
    <main id="app-container">
        <!-- 動態渲染區域 -->
    </main>

    <!-- 管理員審批 Modal -->
    <div id="approval-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:white; padding:20px; width:80%; max-width:600px; border-radius:8px; max-height:80vh; overflow-y:auto;">
            <h2>管理員審批清單</h2>
            <div id="approval-list">載入中...</div>
            <button id="close-modal-btn" style="margin-top:15px; padding:6px 12px;">關閉視窗</button>
        </div>
    </div>

    <!-- 引入前端邏輯 -->
    <script src="app.js"></script>
</body>
</html>
