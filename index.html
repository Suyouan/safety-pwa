<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙端審核 PWA 系統</title>
  <!-- PWA Manifest 連結 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a90e2">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { margin-top: 0; color: #333; font-size: 1.2rem; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    .db-click-btn { background: #28a745; height: 60px; font-size: 1.1rem; }
    .item { background: #fafafa; border: 1px solid #eee; padding: 12px; border-radius: 6px; margin-top: 10px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; background: #ffc107; color: #333; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-approve { background: #28a745; }
    .btn-reject { background: #dc3545; }
  </style>
</head>
<body>

<div class="container">
  <!-- 雙擊遞交區 -->
  <div class="card">
    <h2>使用者遞交區 (雙擊發送)</h2>
    <input type="text" id="applicant" placeholder="請輸入您的名字" value="使用者 A">
    <input type="text" id="content" placeholder="請輸入遞交內容..." value="申請休假 1 天">
    <button id="submitBtn" class="db-click-btn">連點兩下 (雙擊) 遞交資料</button>
  </div>

  <!-- 管理者審核區 -->
  <div class="card">
    <h2>管理者審核區 <button onclick="fetchPendingData()" style="width: auto; float: right; padding: 4px 10px; font-size: 0.8rem;">重新整理</button></h2>
    <div id="loadingText" style="display:none; color:#666;">載入中...</div>
    <div id="pendingList">無待審核資料</div>
  </div>
</div>

<script>
  // ⚠️ 請填入你的 GAS Web App URL
  const GAS_URL = "AKfycbxb3cScYhic7VOl7nn0sgOFRuhiTiApcrwlDV9XTMA1UUD_pNZRBuywOAewUeAv1jWmrw";

  // ----------------------------------------------------
  // 1. 使用者區：雙擊遞交邏輯 (防 405 錯誤 + 防手震)
  // ----------------------------------------------------
  const submitBtn = document.getElementById('submitBtn');
  let isSubmitting = false;

  // 監聽 dblclick (雙擊) 事件
  submitBtn.addEventListener('dblclick', async () => {
    if (isSubmitting) return;
    
    const applicant = document.getElementById('applicant').value.trim();
    const content = document.getElementById('content').value.trim();

    if (!applicant || !content) {
      alert("請完整填寫姓名與內容！");
      return;
    }

    isSubmitting = true;
    submitBtn.disabled = true;
    submitBtn.innerText = "遞交中...";

    const payload = {
      action: "SUBMIT",
      applicant: applicant,
      content: content
    };

    try {
      // ⚠️ 關鍵：使用 text/plain 與 redirect: follow 繞過 Preflight 避免 405
      const res = await fetch(GAS_URL, {
        method: "POST",
        mode: "cors",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      
      const result = await res.json();
      if (result.status === "success") {
        alert("🎉 遞交成功！單號：" + result.id);
        fetchPendingData(); // 自動重新抓取列表
      } else {
        alert("❌ 提交失敗：" + result.message);
      }
    } catch (err) {
      console.error(err);
      alert("網路錯誤，提交失敗！");
    } finally {
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.innerText = "連點兩下 (雙擊) 遞交資料";
    }
  });

  // ----------------------------------------------------
  // 2. 管理者區：抓取待審核清單 (GET)
  // ----------------------------------------------------
  async function fetchPendingData() {
    const listDiv = document.getElementById('pendingList');
    const loading = document.getElementById('loadingText');
    loading.style.display = "block";

    try {
      const res = await fetch(`${GAS_URL}?status=PENDING`, {
        method: "GET",
        redirect: "follow"
      });
      const response = await res.json();

      loading.style.display = "none";
      if (response.status === "success" && response.data.length > 0) {
        listDiv.innerHTML = response.data.map(item => `
          <div class="item">
            <div><span class="badge">${item.status}</span> <strong>${item.applicant}</strong></div>
            <div style="margin: 8px 0; color: #555;">${item.content}</div>
            <small style="color: #999;">${new Date(item.timestamp).toLocaleString()}</small>
            <div class="actions">
              <button class="btn-approve" onclick="review('${item.rowId}', true)">核准</button>
              <button class="btn-reject" onclick="review('${item.rowId}', false)">退回</button>
            </div>
          </div>
        `).join('');
      } else {
        listDiv.innerHTML = "目前沒有待審核的資料";
      }
    } catch (err) {
      loading.style.display = "none";
      listDiv.innerHTML = "載入失敗，請檢查網路連接。";
    }
  }

  // ----------------------------------------------------
  // 3. 管理者區：審核操作 (POST)
  // ----------------------------------------------------
  async function review(rowId, isApproved) {
    const reviewerName = prompt("請輸入管理者名字：", "主管 A");
    if (!reviewerName) return;

    const payload = {
      action: "REVIEW",
      rowId: rowId,
      reviewStatus: isApproved ? "APPROVED" : "REJECTED",
      reviewer: reviewerName
    };

    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        mode: "cors",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      alert(result.message);
      fetchPendingData(); // 重新整理清單
    } catch (err) {
      alert("審核失敗！");
    }
  }

  // ----------------------------------------------------
  // 4. PWA Service Worker 註冊與自動輪詢
  // ----------------------------------------------------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker 註冊成功！', reg))
        .catch(err => console.error('Service Worker 註冊失敗！', err));
    });
  }

  // 頁面開啟時自動加載待審核資料，並設定每 15 秒自動輪詢（同步多裝置）
  fetchPendingData();
  setInterval(fetchPendingData, 15000);
</script>
</body>
</html>
