<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全文化與意識</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    .no-zoom { touch-action: manipulation; }
    .smooth-update { transition: all 0.3s ease-in-out; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center space-x-3 cursor-pointer select-none" id="header-title-container" title="長按3秒進入審批流程">
      <h1 id="app-title" class="text-xl font-bold tracking-wide hover:text-blue-400 transition">安全文化與意識</h1>
      <span id="pending-badge" class="hidden bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full animate-pulse shadow-sm">0 待審</span>
    </div>
    <div class="flex items-center space-x-2">
      <select id="lang-select" class="bg-gray-800 text-white text-sm border border-gray-700 rounded px-2 py-1 focus:outline-none">
        <option value="zh" selected>繁體中文</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-4 py-6 max-w-4xl">
    <div class="grid grid-cols-3 gap-4 mb-8">
      <button id="btn-text-search" class="flex flex-col items-center justify-center bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition border-2 border-transparent hover:border-blue-500 group">
        <span class="text-3xl font-extrabold text-blue-600 group-hover:scale-110 transition">T</span>
        <span class="text-xs sm:text-sm font-medium mt-1 text-gray-600">文字搜尋</span>
      </button>
      <button id="btn-camera" class="flex flex-col items-center justify-center bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition border-2 border-transparent hover:border-green-500 group">
        <svg class="w-8 h-8 text-green-600 group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="text-xs sm:text-sm font-medium mt-1 text-gray-600">掃描 QR</span>
      </button>
      <button id="btn-database" class="flex flex-col items-center justify-center bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition border-2 border-transparent hover:border-purple-500 group">
        <svg class="w-8 h-8 text-purple-600 group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s-8-1.79-8-4"></path></svg>
        <span class="text-xs sm:text-sm font-medium mt-1 text-gray-600">資料庫</span>
      </button>
    </div>
    <div id="content-area" class="w-full">
      <div class="text-center py-12 text-gray-500 font-medium">資料庫同步載入中...</div>
    </div>
  </main>

  <!-- Modals -->
  <div id="modal-search" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="text-lg font-bold mb-4 text-gray-900">輸入標誌編號</h3>
      <input type="text" id="search-input" placeholder="例: W-HighVoltage" class="w-full border rounded-lg p-3 mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      <div class="flex justify-end space-x-3">
        <button id="btn-search-cancel" class="px-4 py-2 bg-gray-200 rounded-lg">取消</button>
        <button id="btn-search-confirm" class="px-4 py-2 bg-blue-600 text-white rounded-lg">確認</button>
      </div>
    </div>
  </div>

  <div id="modal-approval" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-2xl shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="text-xl font-bold text-gray-900">後台審批矩陣 (管理員)</h3>
        <button id="btn-approval-close" class="text-2xl font-bold">&times;</button>
      </div>
      <div id="approval-list" class="flex-grow overflow-y-auto space-y-3 p-1"></div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxb3cScYhic7VOl7nn0sgOFRuhiTiApcrwlDV9XTMA1UUD_pNZRBuywOAewUeAv1jWmrw/exec"; 

    let isoSignsData = []; 
    let currentLang = "zh";
    let currentViewMode = "SINGLE";
    let activeSignId = "";
    let selectedCategoryForExpand = null; // 用於控制第二階段展開

    const i18nDict = {
      zh: { fields: { freq: "發生頻率", elim: "消除", sub: "取代", eng: "工程管制", admin: "行政管制", ppe: "個人防護用具", risk: "風險等級" } }
    };

    document.addEventListener("DOMContentLoaded", async () => {
      setupEventListeners();
      setupHeaderLongPress();
      await fetchSignsFromSheet();
      fetchPendingCount();
      setInterval(fetchPendingCount, 15000);
    });

    async function fetchSignsFromSheet() {
      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=GET_SIGNS`);
        const result = await res.json();
        if (result.status === "success" && result.data.length > 0) {
          isoSignsData = result.data.map(item => ({
            ...item,
            id: item.id || item.Code,
            category: item.Category || item.category,
            // 優先使用 A 欄的 Image 欄位作為圖片顯示來源
            displayImg: item.Image || item.svg_url || item.svgUrl
          }));
          if (!activeSignId && isoSignsData.length > 0) {
            activeSignId = isoSignsData[0].id;
          }
          renderCurrentView();
        }
      } catch (err) {
        console.error("載入資料失敗:", err);
      }
    }

    async function fetchPendingCount() {
      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?status=PENDING`);
        const result = await res.json();
        const badge = document.getElementById("pending-badge");
        if (result.status === "success" && Array.isArray(result.data) && result.data.length > 0) {
          badge.textContent = `${result.data.length} 待審`;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      } catch (e) {}
    }

    function renderCurrentView() {
      const container = document.getElementById("content-area");
      container.innerHTML = "";
      if (currentViewMode === "SINGLE") {
        renderSingleSignDetail(container, activeSignId);
      } else if (currentViewMode === "DATABASE") {
        if (!selectedCategoryForExpand) {
          renderDatabaseCategoryOverview(container);
        } else {
          renderDatabaseCategoryDetail(container, selectedCategoryForExpand);
        }
      }
    }

    // 階段一：資料庫點擊進入，顯示各分類 (Category) 的代表封面
    function renderDatabaseCategoryOverview(container) {
      const grid = document.createElement("div");
      grid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4";
      
      const categories = {};
      isoSignsData.forEach(item => {
        const cat = item.category || "未分類";
        if (!categories[cat]) {
          categories[cat] = item;
        }
      });

      Object.keys(categories).forEach(cat => {
        const sign = categories[cat];
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-xl shadow border hover:shadow-md transition cursor-pointer flex flex-col items-center text-center group";
        card.innerHTML = `
          <div class="w-20 h-20 flex items-center justify-center mb-2 bg-gray-50 rounded-lg p-1">
            <img src="${sign.displayImg}" class="w-full h-full object-contain group-hover:scale-105 transition" onerror="this.src='https://via.placeholder.com/80?text=No+Image'">
          </div>
          <span class="font-bold text-gray-800 text-sm">分類: ${cat}</span>
          <span class="text-xs text-gray-400 mt-1">點擊檢視標誌清單</span>
        `;
        card.addEventListener("click", () => {
          selectedCategoryForExpand = cat;
          renderCurrentView();
        });
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }

    // 階段二：點擊分類後，顯示該分類下的「每一個標誌與說明」清單
    function renderDatabaseCategoryDetail(container, category) {
      const wrapper = document.createElement("div");
      wrapper.innerHTML = `
        <button id="back-to-categories" class="mb-4 px-3 py-1.5 bg-gray-200 text-gray-700 text-sm rounded-lg hover:bg-gray-300 transition">← 返回分類總覽</button>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="sub-grid"></div>
      `;
      container.appendChild(wrapper);

      document.getElementById("back-to-categories").addEventListener("click", () => {
        selectedCategoryForExpand = null;
        renderCurrentView();
      });

      const subGrid = document.getElementById("sub-grid");
      const filtered = isoSignsData.filter(s => (s.category || "未分類") === category);
      
      // 確保每個 id 只出現一次（抓取 level 1 作為代表）
      const uniqueSigns = [];
      const seenIds = new Set();
      filtered.forEach(s => {
        if (!seenIds.has(s.id)) {
          seenIds.add(s.id);
          uniqueSigns.push(s);
        }
      });

      uniqueSigns.forEach(sign => {
        const item = document.createElement("div");
        item.className = "bg-white p-4 rounded-xl shadow border flex items-center space-x-4 cursor-pointer hover:border-blue-400 transition group";
        item.innerHTML = `
          <div class="w-16 h-16 flex-shrink-0 flex items-center justify-center bg-gray-50 rounded-lg p-1">
            <img src="${sign.displayImg}" class="w-full h-full object-contain group-hover:scale-105 transition" onerror="this.src='https://via.placeholder.com/64?text=No+Image'">
          </div>
          <div class="overflow-hidden">
            <h4 class="font-bold text-gray-800 text-sm truncate">${sign.name_zh || sign.id}</h4>
            <p class="text-xs text-gray-500 truncate mt-0.5">編號: ${sign.id}</p>
            <span class="inline-block text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded mt-1">點擊檢視詳細資訊</span>
          </div>
        `;
        // 第三階段：點擊該標誌後，進入該標誌的相關詳細訊息與 7 大控制欄位
        item.addEventListener("click", () => {
          activeSignId = sign.id;
          currentViewMode = "SINGLE";
          renderCurrentView();
        });
        subGrid.appendChild(item);
      });
    }

    // 階段三：渲染單一標誌的詳細資訊（若為 Warning sign 則展開 4 個等級）
    function renderSingleSignDetail(container, signId) {
      const matchedSigns = isoSignsData.filter(s => String(s.id).toLowerCase() === String(signId).toLowerCase());
      if (matchedSigns.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-500 font-medium">找不到符合該標誌的資訊！</div>`;
        return;
      }

      const isWarning = matchedSigns[0].category === "W";
      const wrapper = document.createElement("div");
      wrapper.className = "space-y-6 max-w-2xl mx-auto";

      // 附加返回資料庫按鈕
      const backBar = document.createElement("div");
      backBar.innerHTML = `<button id="back-to-db" class="mb-2 px-3 py-1.5 bg-gray-200 text-gray-700 text-sm rounded-lg hover:bg-gray-300 transition">← 返回標誌清單</button>`;
      container.appendChild(backBar);
      document.getElementById("back-to-db").addEventListener("click", () => {
        currentViewMode = "DATABASE";
        renderCurrentView();
      });

      const levelsToRender = isWarning ? matchedSigns : [matchedSigns[0]];

      levelsToRender.forEach((sign, idx) => {
        const levelNum = sign.level || (idx + 1);
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-6 shadow-lg border border-gray-100 smooth-update";
        card.innerHTML = `
          <div class="flex flex-col sm:flex-row items-center justify-between border-b pb-6 gap-4">
            <div class="flex flex-col items-center text-center">
              <div class="w-28 h-28 flex items-center justify-center p-1 bg-gray-50 rounded-xl border relative">
                <img src="${sign.displayImg}" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/112?text=No+Image'">
                ${isWarning ? `<span class="absolute bottom-1 bg-yellow-400 text-black font-black text-xs px-2 py-0.5 rounded-full shadow">機率 ${levelNum}</span>` : ''}
              </div>
              <h3 class="mt-3 font-bold text-gray-900 text-lg">${sign.name_zh || sign.id}</h3>
            </div>
            <div class="flex flex-col items-center sm:items-end">
              <div id="qrcode-${sign.id}-${levelNum}" class="p-2 bg-white border rounded-xl shadow-inner"></div>
              <span class="mt-3 text-xs font-mono font-bold bg-gray-100 text-gray-700 px-3 py-1 rounded-md border">${sign.id} ${isWarning ? '(Level ' + levelNum + ')' : ''}</span>
            </div>
          </div>
          <div class="mt-6 border-t pt-4 space-y-2">
            <h5 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">雙擊框格編輯提交</h5>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
              ${renderSubFieldsHtml(sign, levelNum)}
            </div>
          </div>
        `;
        wrapper.appendChild(card);

        setTimeout(() => {
          const qrContainer = document.getElementById(`qrcode-${sign.id}-${levelNum}`);
          if (qrContainer) {
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: sign.id, width: 80, height: 80 });
          }
        }, 50);
      });

      container.appendChild(wrapper);
      bindSubFieldEvents();
    }

    function renderSubFieldsHtml(sign, levelNum) {
      const fieldKeys = ["freq", "elim", "sub", "eng", "admin", "ppe", "risk"];
      const fieldsDict = i18nDict[currentLang].fields;

      return fieldKeys.map(key => {
        const fieldName = fieldsDict[key];
        const val = sign[key] || "-";
        return `
          <div class="sub-field-box border rounded-lg p-3 bg-gray-50 hover:bg-blue-50/50 transition cursor-pointer no-zoom"
               data-sign-id="${sign.id}" data-level="${levelNum}" data-field-key="${key}">
            <div class="flex justify-between font-semibold text-gray-600 mb-1"><span>${fieldName}</span></div>
            <div class="text-gray-800 font-medium">${val}</div>
          </div>
        `;
      }).join('');
    }

    function bindSubFieldEvents() {
      document.querySelectorAll(".sub-field-box").forEach(box => {
        box.addEventListener("dblclick", () => {
          const signId = box.getAttribute("data-sign-id");
          const level = box.getAttribute("data-level");
          const fieldKey = box.getAttribute("data-field-key");
          const fieldName = i18nDict[currentLang].fields[fieldKey];
          
          const userInput = prompt(`【提交修改】請輸入 ${signId} (等級 ${level}) 之「${fieldName}」新內容：`);
          if (userInput && userInput.trim() !== "") {
            submitPendingData(signId, level, fieldKey, userInput.trim());
          }
        });
      });
    }

    async function submitPendingData(signId, level, fieldKey, val) {
      const payload = {
        action: "SUBMIT",
        applicant: "使用者",
        content: JSON.stringify({ id: signId, level: level, field: fieldKey, value: val, path: `ISO7010 > ${signId} (L${level}) > ${fieldKey}` })
      };

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          alert("🎉 提交成功！等待管理員審批後將自動更新至資料庫。");
          fetchPendingCount();
        } else {
          alert("❌ 提交失敗：" + result.message);
        }
      } catch (err) {
        alert("網路通訊失敗！");
      }
    }

    function setupHeaderLongPress() {
      const container = document.getElementById("header-title-container");
      let timer = null;
      container.addEventListener("mousedown", () => timer = setTimeout(openApprovalModal, 3000));
      container.addEventListener("mouseup", () => clearTimeout(timer));
      container.addEventListener("touchstart", () => timer = setTimeout(openApprovalModal, 3000), { passive: true });
      container.addEventListener("touchend", () => clearTimeout(timer));
    }

    async function openApprovalModal() {
      const modal = document.getElementById("modal-approval");
      const listContainer = document.getElementById("approval-list");
      listContainer.innerHTML = `<div class="text-center py-8 text-gray-500">加載中...</div>`;
      modal.classList.remove("hidden");

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?status=PENDING`);
        const result = await res.json();
        if (result.status === "success" && result.data.length > 0) {
          listContainer.innerHTML = "";
          result.data.forEach(item => {
            let parsed = {};
            try { parsed = JSON.parse(item.content); } catch (e) {}
            const div = document.createElement("div");
            div.className = "p-4 bg-gray-50 rounded-xl border flex justify-between items-center mb-2";
            div.innerHTML = `
              <div>
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${parsed.path || '資料區塊'}</span>
                <p class="text-sm font-semibold text-gray-800 mt-1">${parsed.value}</p>
                <span class="text-[10px] text-gray-400">申請者: ${item.applicant}</span>
              </div>
              <div class="flex space-x-2">
                <button onclick="reviewItem('${item.rowId}', 'APPROVED')" class="px-3 py-1.5 bg-green-600 text-white text-xs font-bold rounded-lg">通過</button>
                <button onclick="reviewItem('${item.rowId}', 'REJECTED')" class="px-3 py-1.5 bg-red-600 text-white text-xs font-bold rounded-lg">拒絕</button>
              </div>
            `;
            listContainer.appendChild(div);
          });
        } else {
          listContainer.innerHTML = `<div class="text-center py-8 text-gray-500">目前無待審批訊息。</div>`;
        }
      } catch (e) {
        listContainer.innerHTML = `<div class="text-center py-8 text-red-500">加載失敗！</div>`;
      }
    }

    window.reviewItem = async function(rowId, status) {
      if (!confirm(`確定要${status === 'APPROVED' ? '核准' : '拒絕'}嗎？`)) return;
      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "REVIEW", rowId: rowId, reviewStatus: status, reviewer: "管理員" })
        });
        const result = await res.json();
        if (result.status === "success") {
          alert("處理成功！資料已直接寫入 ISO7010 分頁。");
          openApprovalModal();
          fetchSignsFromSheet();
          fetchPendingCount();
        }
      } catch (e) {
        alert("操作失敗！");
      }
    };

    function setupEventListeners() {
      document.getElementById("btn-text-search").addEventListener("click", () => document.getElementById("modal-search").classList.remove("hidden"));
      document.getElementById("btn-search-cancel").addEventListener("click", () => document.getElementById("modal-search").classList.add("hidden"));
      document.getElementById("btn-search-confirm").addEventListener("click", () => {
        const query = document.getElementById("search-input").value.trim();
        document.getElementById("modal-search").classList.add("hidden");
        if (query) { activeSignId = query; currentViewMode = "SINGLE"; renderCurrentView(); }
      });
      document.getElementById("btn-database").addEventListener("click", () => {
        currentViewMode = "DATABASE";
        selectedCategoryForExpand = null;
        renderCurrentView();
      });
      document.getElementById("btn-approval-close").addEventListener("click", () => document.getElementById("modal-approval").classList.add("hidden"));
    }
  </script>
</body>
</html>
