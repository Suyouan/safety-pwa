<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO 7010 安全標誌與 7 大危害風險評估系統</title>
    <!-- 引入 SheetJS 與 QRCode 庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; margin: 0; padding: 0; background: #f4f6f9; color: #333; }
        header { background: #007bff; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .sign-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; position: relative; transition: transform 0.2s; }
        .sign-card.clickable { cursor: pointer; }
        .sign-card.clickable:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .sign-content-box { display: flex; justify-content: space-around; align-items: center; margin-bottom: 10px; }
        .sign-img-wrap img { max-width: 60px; max-height: 60px; object-fit: contain; }
        .sign-badge { display: inline-block; padding: 3px 8px; font-size: 11px; border-radius: 4px; background: #e9ecef; color: #495057; margin-top: 5px; }
        .action-btn { background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .action-btn:hover { background: #0056b3; }
        .eval-table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .eval-table th, .eval-table td { border: 1px solid #dee2e6; padding: 12px; text-align: center; }
        .eval-table th { background: #f8f9fa; }
        .editable-cell { background: #fffdf0; cursor: pointer; }
        .editable-cell:hover { background: #fff9c4; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 8px; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div>
            <h2>🛡️ ISO 7010 安全標誌系統</h2>
            <span id="status" style="font-size: 12px; opacity: 0.8;">系統初始化中...</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="searchInput" placeholder="🔍 搜尋 ID、名稱、類別..." oninput="handleSearch()" style="padding: 6px; border-radius: 4px; border: none; width: 180px;">
            <button id="backBtn" class="action-btn" style="display:none; background: #6c757d;" onclick="goBack()">⬅️ 返回</button>
            <button class="action-btn" style="background: #28a745;" onclick="exportFullCatalogWord()">📄 匯出完整清冊(Word)</button>
            <button class="action-btn" style="background: #17a2b8;" onclick="exportToExcel()">📊 匯出 Excel</button>
            <button class="action-btn" onclick="openAdminModal()">⚙️ 管理員專區</button>
        </div>
    </header>

    <div class="container">
        <!-- 檢視 1：分類首頁 -->
        <div id="categoryView" class="view-section active">
            <h3>安全標誌分類</h3>
            <div id="categoryGrid" class="card-grid"></div>
        </div>

        <!-- 檢視 2：分類明細 / 搜尋結果 -->
        <div id="detailView" class="view-section">
            <h3 id="detailCategoryTitle">標誌明細</h3>
            <p id="detailHint" style="font-size: 13px; color: #666;"></p>
            <div id="detailGrid" class="card-grid"></div>
        </div>

        <!-- 檢視 3：7 大危害風險評估頁面 -->
        <div id="evalView" class="view-section">
            <input type="hidden" id="evalUniqueKey">
            <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 20px;">
                <img id="evalPageImg" src="" style="max-width: 80px; max-height: 80px; object-fit: contain;">
                <div>
                    <h2 id="evalPageTitle" style="margin: 0 0 5px 0;">標誌名稱</h2>
                    <div id="evalPageSub" style="color: #666; font-size: 14px;">風險等級</div>
                </div>
            </div>

            <p id="evalHintText" style="margin-top: 15px; font-size: 13px; color: #007bff;"></p>

            <table class="eval-table">
                <thead>
                    <tr>
                        <th>評估項目</th>
                        <th>內容描述 (雙擊欄位可編輯)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td><strong>發生頻率 (Freq)</strong></td><td id="cell_freq" class="editable-cell" ondblclick="enableCellEdit('freq')">-</td></tr>
                    <tr><td><strong>消除 (Elim)</strong></td><td id="cell_elim" class="editable-cell" ondblclick="enableCellEdit('elim')">-</td></tr>
                    <tr><td><strong>替代 (Sub)</strong></td><td id="cell_sub" class="editable-cell" ondblclick="enableCellEdit('sub')">-</td></tr>
                    <tr><td><strong>工程控制 (Eng)</strong></td><td id="cell_eng" class="editable-cell" ondblclick="enableCellEdit('eng')">-</td></tr>
                    <tr><td><strong>管理控制 (Admin)</strong></td><td id="cell_admin" class="editable-cell" ondblclick="enableCellEdit('admin')">-</td></tr>
                    <tr><td><strong>個人防護具 (Ppe)</strong></td><td id="cell_ppe" class="editable-cell" ondblclick="enableCellEdit('ppe')">-</td></tr>
                    <tr><td><strong>綜合風險評估 (Risk)</strong></td><td id="cell_risk">-</td></tr>
                </tbody>
            </table>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="action-btn" onclick="goBackToDetail()">⬅️ 返回列表</button>
                <button class="action-btn admin-only" style="background: #28a745; display:none;" onclick="saveEvaluation()">💾 儲存評估變更</button>
            </div>
        </div>
    </div>

    <!-- 管理員 Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('adminModal').style.display='none'">&times;</span>
            <h3>⚙️ 管理員控制中心</h3>
            <div id="loginView">
                <p>請輸入管理員密碼：</p>
                <input type="password" id="pwdInput" placeholder="請輸入密碼..." style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
                <button class="action-btn" onclick="verifyLogin()">登入</button>
            </div>
            <div id="controlView" style="display:none;">
                <p style="color: green; font-weight: bold;">🟢 目前已登入管理員模式</p>
                <button class="action-btn" style="width: 100%; margin-bottom: 8px; background: #28a745;" onclick="openPendingModal()">📋 檢視待審批變更</button>
                <button class="action-btn" style="width: 100%; margin-bottom: 8px;" onclick="openAddModal()">➕ 新增安全標誌</button>
                <hr style="margin: 15px 0;">
                <h4>修改密碼</h4>
                <input type="password" id="oldPwd" placeholder="舊密碼" style="width: 100%; padding: 6px; margin-bottom: 6px; box-sizing: border-box;">
                <input type="password" id="newPwd" placeholder="新密碼" style="width: 100%; padding: 6px; margin-bottom: 10px; box-sizing: border-box;">
                <button class="action-btn" style="width: 100%; background: #ffc107; color: black; margin-bottom: 15px;" onclick="changePassword()">確認修改密碼</button>
                <button class="action-btn" style="width: 100%; background: #dc3545;" onclick="adminLogout()">登出管理員</button>
            </div>
        </div>
    </div>

    <!-- 待審批清單 Modal -->
    <div id="pendingModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-btn" onclick="closePendingModal()">&times;</span>
            <h3>📋 使用者建議審批清單</h3>
            <div id="pendingListContainer" style="max-height: 400px; overflow-y: auto; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- 新增標誌 Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('addModal').style.display='none'">&times;</span>
            <h3>➕ 新增安全標誌</h3>
            <label>ID / 編號：</label><input type="text" id="addId" style="width:150px; margin-bottom:8px;"><br>
            <label>類別 (Category)：</label><input type="text" id="addCategory" style="width:100%; margin-bottom:8px;"><br>
            <label>標誌名稱 (Name)：</label><input type="text" id="addName" style="width:100%; margin-bottom:8px;"><br>
            <label>圖片 SVG URL：</label><input type="text" id="addImg" style="width:100%; margin-bottom:15px;"><br>
            <button class="action-btn" onclick="submitAdd()">確認新增</button>
        </div>
    </div>

    <script>
        const GAS_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE"; // 請替換為您的 GAS 部署網址
        let masterData = [];
        let currentCategory = '';
        let isAdmin = sessionStorage.getItem('isAdmin') === 'true';

        window.onload = function() {
            updateAdminUI();
            initPhase5();
        };

        async function initPhase5() {
            document.getElementById('status').innerText = "正在從雲端載入資料...";
            try {
                let response = await fetch(`${GAS_URL}?action=getData`);
                let result = await response.json();
                if (result.data) {
                    masterData = result.data.map((item, idx) => ({
                        ...item,
                        uniqueKey: `${item.id || item.ID || idx}-${item.risk || item.Risk || 'Normal'}`
                    }));
                    renderCategoryGrid(masterData);
                    document.getElementById('status').innerText = `✅ 系統就緒 | 總筆數：${masterData.length} 筆`;
                    
                    // 檢查網址是否有自動夾帶 evalKey
                    const urlParams = new URLSearchParams(window.location.search);
                    let evalKey = urlParams.get('evalKey');
                    if (evalKey) {
                        openEvalView(evalKey);
                    }
                }
            } catch (e) {
                console.error("載入失敗：", e);
                document.getElementById('status').innerText = "❌ 雲端資料載入失敗（使用離線預設或檢查網路）";
            }
        }

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            let target = document.getElementById(viewId);
            if (target) target.classList.add('active');
        }

        function goBack() {
            let evalView = document.getElementById('evalView');
            let detailView = document.getElementById('detailView');
            
            if (evalView && evalView.classList.contains('active')) {
                goBackToDetail();
            } else if (detailView && detailView.classList.contains('active')) {
                currentCategory = '';
                renderCategoryGrid(masterData);
                showView('categoryView');
                document.getElementById('backBtn').style.display = 'none';
            }
        }

        function goBackToDetail() {
            showView('detailView');
            document.getElementById('evalView').style.display = 'none';
        }

        function renderCategoryGrid(data) {
            let container = document.getElementById('categoryGrid');
            container.innerHTML = '';
            
            let categories = [...new Set(data.map(item => String(item.category || item.Category || '未分類').trim()))];
            
            categories.forEach(cat => {
                let count = data.filter(item => String(item.category || item.Category || '未分類').trim() === cat).length;
                let card = document.createElement('div');
                card.className = 'sign-card clickable';
                card.onclick = () => selectCategory(cat);
                card.innerHTML = `
                    <div style="font-size: 18px; font-weight: bold; color: #007bff; margin-bottom: 8px;">📁 ${cat}</div>
                    <div style="font-size: 13px; color: #666;">包含標誌數：${count} 筆</div>
                `;
                container.appendChild(card);
            });
        }

        function selectCategory(categoryName) {
            currentCategory = categoryName;
            let filtered = masterData.filter(item => String(item.category || item.Category || '').trim() === categoryName);
            showView('detailView');
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('detailCategoryTitle').innerText = `📁 分類：${categoryName}`;
            document.getElementById('detailHint').innerText = "💡 點擊安全標誌卡片可進入 7 大危害風險評估與編輯頁面。";
            renderDetailGrid(filtered, categoryName, true);
        }

        function renderDetailGrid(data, categoryName, isWarning = true) {
            let gridContainer = document.getElementById('detailGrid');
            gridContainer.innerHTML = '';

            if (data.length === 0) {
                gridContainer.innerHTML = `<p style="color: #888;">找不到符合條件的資料</p>`;
                return;
            }

            data.forEach((item, index) => {
                let card = document.createElement('div');
                let rowId = item.id || item.ID || '';
                let rowName = item.name || item.Name || '';
                let rowRisk = item.risk || item.Risk || '';
                let imgUrl = item.svg_url || item.image || '';

                if (isWarning) {
                    card.className = 'sign-card clickable';
                    card.onclick = () => openEvalView(item.uniqueKey);
                    card.title = "點擊進入 7 大危害風險評估頁面";
                } else {
                    card.className = 'sign-card';
                }

                let badgeHtml = rowRisk ? `<div class="sign-badge">${rowRisk}</div>` : '';
                let deleteBtnHtml = isAdmin ? `<br><button class="action-btn" style="background:#dc3545; margin-top:8px;" onclick="event.stopPropagation(); deleteRow('${rowId}', '${rowRisk}')">刪除</button>` : '';

                card.innerHTML = `
                    <div class="sign-content-box">
                        <div class="sign-img-wrap">
                            ${imgUrl ? `<img src="${imgUrl}">` : '<div style="height:55px; line-height:55px;">無圖示</div>'}
                        </div>
                        <div class="qr-code-wrap" id="qrcode_${index}_${rowId}"></div>
                    </div>
                    <div style="font-weight: bold; font-size: 14px; color: #007bff;">${rowId}</div>
                    <div style="font-size: 13px; color: #333; margin: 4px 0;">${rowName}</div>
                    ${badgeHtml}
                    ${deleteBtnHtml}
                `;
                gridContainer.appendChild(card);

                setTimeout(() => {
                    let qrContainer = document.getElementById(`qrcode_${index}_${rowId}`);
                    if (qrContainer && qrContainer.innerHTML === "") {
                        let targetUrl = window.location.origin + window.location.pathname + "?evalKey=" + encodeURIComponent(item.uniqueKey);
                        new QRCode(qrContainer, {
                            text: targetUrl,
                            width: 50,
                            height: 50,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.L
                        });
                    }
                }, 50);
            });
        }

        function openEvalView(uniqueKey) {
            let item = masterData.find(d => d.uniqueKey === uniqueKey);
            if (!item) return;

            document.getElementById('evalUniqueKey').value = uniqueKey;
            document.getElementById('evalPageImg').src = item.svg_url || item.image || '';
            document.getElementById('evalPageTitle').innerText = item.name || item.Name || '安全標誌';
            document.getElementById('evalPageSub').innerText = `風險等級: ${item.risk || item.Risk || 'Normal'}`;

            document.getElementById('cell_freq').innerText = item.freq || item.Freq || '-';
            document.getElementById('cell_elim').innerText = item.elim || item.Elim || '-';
            document.getElementById('cell_sub').innerText = item.sub || item.Sub || '-';
            document.getElementById('cell_eng').innerText = item.eng || item.Eng || '-';
            document.getElementById('cell_admin').innerText = item.admin || item.Admin || '-';
            document.getElementById('cell_ppe').innerText = item.ppe || item.Ppe || '-';
            document.getElementById('cell_risk').innerText = item.risk || item.Risk || '-';

            let hintText = document.getElementById('evalHintText');
            if (isAdmin) {
                hintText.innerText = "💡 [管理者模式] 點擊儲存按鈕可直接將變更寫入雲端試算表。";
            } else {
                hintText.innerText = "💡 [一般檢視] 雙擊欄位可輸入新資訊（輸入後將送出並等待管理員審批）。";
            }

            showView('evalView');
            document.getElementById('backBtn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function enableCellEdit(fieldKey) {
            let cell = document.getElementById(`cell_${fieldKey}`);
            if (cell.querySelector('input')) return;

            let originalVal = cell.innerText === '-' ? '' : cell.innerText;
            let defaultInputVal = isAdmin ? originalVal : '';
            cell.innerHTML = `<input type="text" id="input_${fieldKey}" value="${defaultInputVal}" placeholder="請輸入新資訊..." style="width: 90%; padding: 4px;" autofocus>`;
            
            let inputEl = document.getElementById(`input_${fieldKey}`);
            let isCommitted = false;
            
            async function commitEdit() {
                if (isCommitted) return;
                isCommitted = true;
                let newVal = inputEl.value.trim();

                if (!newVal && !isAdmin) {
                    cell.innerText = originalVal || '-';
                    return;
                }

                let uniqueKey = document.getElementById('evalUniqueKey').value;
                let item = masterData.find(d => d.uniqueKey === uniqueKey);

                if (isAdmin) {
                    cell.innerText = newVal || '-';
                    if (item) item[fieldKey] = newVal;
                    document.getElementById('status').innerText = `💡 [管理者] 欄位 [${fieldKey}] 已暫存，請點擊「儲存評估變更」！`;
                } else {
                    cell.innerText = originalVal || '-';
                    try {
                        let rowId = item ? (item.id || item.ID || '') : '';
                        let rowRisk = item ? (item.risk || item.Risk || '') : '';
                        let updatePayload = {
                            action: 'submitPendingApproval',
                            uniqueKey: uniqueKey,
                            id: rowId,
                            risk: rowRisk,
                            field: fieldKey,
                            value: newVal
                        };
                        await fetch(GAS_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify(updatePayload)
                        });
                        alert("✅ 您的修改已送出，目前已進入後台等待管理員審批！");
                    } catch (e) {
                        alert("❌ 審批送出失敗，請檢查網路連線。");
                    }
                }
            }

            inputEl.onblur = commitEdit;
            inputEl.onkeydown = function(e) { if (e.key === 'Enter') commitEdit(); };
        }

        async function saveEvaluation() {
            let uniqueKey = document.getElementById('evalUniqueKey').value;
            let item = masterData.find(d => d.uniqueKey === uniqueKey);
            if (!item) return;

            let updatedData = {
                action: 'updateEvaluation',
                uniqueKey: uniqueKey,
                id: item.id || item.ID || '',
                risk: item.risk || item.Risk || '',
                freq: document.getElementById('cell_freq').innerText === '-' ? '' : document.getElementById('cell_freq').innerText,
                elim: document.getElementById('cell_elim').innerText === '-' ? '' : document.getElementById('cell_elim').innerText,
                sub: document.getElementById('cell_sub').innerText === '-' ? '' : document.getElementById('cell_sub').innerText,
                eng: document.getElementById('cell_eng').innerText === '-' ? '' : document.getElementById('cell_eng').innerText,
                admin: document.getElementById('cell_admin').innerText === '-' ? '' : document.getElementById('cell_admin').innerText,
                ppe: document.getElementById('cell_ppe').innerText === '-' ? '' : document.getElementById('cell_ppe').innerText
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(updatedData)
                });
                alert("✅ [管理者] 7 大危害風險評估已成功儲存！");
                goBackToDetail();
            } catch (e) {
                alert("❌ 網路連線異常，儲存失敗。");
            }
        }

        function handleSearch() {
            let keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!keyword) {
                if (currentCategory) {
                    let filtered = masterData.filter(item => String(item.category || item.Category || '').trim() === currentCategory);
                    renderDetailGrid(filtered, currentCategory);
                } else {
                    renderCategoryGrid(masterData);
                    showView('categoryView');
                    document.getElementById('backBtn').style.display = 'none';
                }
                return;
            }

            showView('detailView');
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('detailCategoryTitle').innerText = `🔍 搜尋結果：「${keyword}」`;
            document.getElementById('detailHint').innerText = "💡 搜尋結果展示。";

            let filtered = masterData.filter(item => 
                String(item.id || item.ID || '').toLowerCase().includes(keyword) || 
                String(item.name || item.Name || '').toLowerCase().includes(keyword) ||
                String(item.category || item.Category || '').toLowerCase().includes(keyword)
            );
            renderDetailGrid(filtered, 'Search Result');
        }

        function openAdminModal() { document.getElementById('adminModal').style.display = 'block'; updateAdminUI(); }
        function openPendingModal() { document.getElementById('pendingModal').style.display = 'block'; getPendingList(); }
        function closePendingModal() { document.getElementById('pendingModal').style.display = 'none'; }

        async function getPendingList() {
            try {
                let container = document.getElementById('pendingListContainer');
                container.innerHTML = "<p>正在載入待審批清單...</p>";
                let response = await fetch(`${GAS_URL}?action=getPendingList`);
                let result = await response.json();
                if (result.status !== "success" || !result.data || result.data.length === 0) {
                    container.innerHTML = "<p>目前沒有需要審批的變更資料。</p>";
                    return;
                }
                let html = `<table style="width:100%; border-collapse: collapse; text-align: left;"><thead><tr style="background: #f8f9fa;"><th style="padding: 10px;">ID</th><th style="padding: 10px;">風險</th><th style="padding: 10px;">欄位</th><th style="padding: 10px;">變更值</th><th style="padding: 10px; text-align: center;">操作</th></tr></thead><tbody>`;
                result.data.forEach(item => {
                    html += `<tr style="border-bottom: 1px solid #dee2e6;"><td style="padding: 10px;">${item.id}</td><td style="padding: 10px;">${item.risk || '-'}</td><td style="padding: 10px;">${item.field}</td><td style="padding: 10px;">${item.value}</td><td style="padding: 10px; text-align: center;"><button onclick="approvePendingItem('${item.id}', '${item.risk}', '${item.field}', '${item.value}')" style="background: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; margin-right: 5px;">核准</button><button onclick="rejectPendingItem('${item.id}', '${item.risk}', '${item.field}')" style="background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">拒絕</button></td></tr>`;
                });
                container.innerHTML = html + '</tbody></table>';
            } catch (e) {
                document.getElementById('pendingListContainer').innerHTML = "<p style='color:red;'>❌ 載入失敗。</p>";
            }
        }

        async function approvePendingItem(id, risk, field, value) {
            if (!confirm(`確定要核准 ID: ${id} (${field} -> ${value}) 嗎？`)) return;
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'approvePending', id, risk, field, value }) });
                alert("✅ 已核准！");
                getPendingList();
            } catch (e) { alert("❌ 操作失敗"); }
        }

        async function rejectPendingItem(id, risk, field) {
            if (!confirm(`確定要拒絕 ID: ${id} (${field}) 嗎？`)) return;
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'rejectPending', id, risk, field }) });
                alert("🚫 已拒絕。");
                getPendingList();
            } catch (e) { alert("❌ 操作失敗"); }
        }

        function updateAdminUI() {
            let controlView = document.getElementById('controlView');
            let loginView = document.getElementById('loginView');
            if (loginView && controlView) {
                loginView.style.display = isAdmin ? 'none' : 'block';
                controlView.style.display = isAdmin ? 'block' : 'none';
            }
            document.querySelectorAll('.admin-only').forEach(el => {
                el.style.display = isAdmin ? 'inline-block' : 'none';
            });
        }

        function verifyLogin() {
            if (document.getElementById('pwdInput').value === '0') {
                isAdmin = true;
                sessionStorage.setItem('isAdmin', 'true');
                alert("管理員登入成功！");
                document.getElementById('adminModal').style.display = 'none';
                document.getElementById('pwdInput').value = '';
                updateAdminUI();
                openPendingModal();
            } else { alert("密碼錯誤！"); }
        }

        async function changePassword() {
            let oldP = document.getElementById('oldPwd').value;
            let newP = document.getElementById('newPwd').value;
            if (!oldP || !newP) { alert("請完整輸入"); return; }
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'updatePassword', oldPwd: oldP, newPwd: newP }) });
                alert("密碼變更請求已送出！");
                document.getElementById('adminModal').style.display = 'none';
            } catch (e) { alert("修改失敗"); }
        }

        function adminLogout() {
            isAdmin = false;
            sessionStorage.removeItem('isAdmin');
            updateAdminUI();
            alert("已登出");
            document.getElementById('adminModal').style.display = 'none';
        }

        async function deleteRow(id, risk) {
            if (!confirm(`確定要刪除 ID: ${id} 嗎？`)) return;
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'deleteRecord', id, risk }) });
                alert("已送出刪除請求！");
                setTimeout(() => initPhase5(), 2000);
            } catch (e) { alert("刪除失敗"); }
        }

        function openAddModal() { document.getElementById('addModal').style.display = 'block'; }

        async function submitAdd() {
            let newId = document.getElementById('addId').value.trim();
            let newCat = document.getElementById('addCategory').value.trim();
            let newName = document.getElementById('addName').value.trim();
            let newImg = document.getElementById('addImg').value.trim();
            if (!newId || !newCat || !newName) { alert("請填寫完整"); return; }
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'addRecord', id: newId, category: newCat, name: newName, svg_url: newImg }) });
                alert("✅ 新增成功！");
                document.getElementById('addModal').style.display = 'none';
                setTimeout(() => initPhase5(), 1500);
            } catch (e) { alert("新增失敗"); }
        }

        // 完整清冊匯出 Word（包含標誌圖形、風險等級與專屬連結）
        async function exportFullCatalogWord() {
            if (masterData.length === 0) { alert("目前沒有資料！"); return; }
            let htmlContent = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>body{font-family:'Microsoft JhengHei',sans-serif;}table{width:100%;border-collapse:collapse;margin-top:20px;}th,td{border:1px solid #999;padding:8px;text-align:center;vertical-align:middle;}th{background-color:#007bff;color:white;}.risk-high{color:red;font-weight:bold;}.risk-normal{color:green;}</style></head><body><h2 style="text-align:center;">ISO 7010 安全標誌與風險評估清冊</h2><table><thead><tr><th>標誌圖示</th><th>ID</th><th>名稱</th><th>類別</th><th>風險等級</th><th>專屬評估連結</th></tr></thead><tbody>`;
            
            masterData.forEach(item => {
                let rowId = item.id || item.ID || '';
                let rowName = item.name || item.Name || '';
                let rowCat = item.category || item.Category || '';
                let rowRisk = item.risk || item.Risk || 'Normal';
                let imgUrl = item.svg_url || item.image || '';
                let targetUrl = window.location.origin + window.location.pathname + "?evalKey=" + encodeURIComponent(item.uniqueKey);

                htmlContent += `<tr><td>${imgUrl ? `<img src="${imgUrl}" width="40" height="40"/>` : '無'}</td><td><b>${rowId}</b></td><td>${rowName}</td><td>${rowCat}</td><td><span class="${rowRisk === 'High' ? 'risk-high' : 'risk-normal'}">${rowRisk}</span></td><td style="font-size:9px;word-break:break-all;"><a href="${targetUrl}">${targetUrl}</a></td></tr>`;
            });
            htmlContent += `</tbody></table></body></html>`;

            let blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `ISO7010_Full_Catalog_${new Date().toISOString().slice(0,10)}.doc`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportToExcel() {
            if (masterData.length === 0) { alert("目前沒有資料！"); return; }
            let exportData = masterData.map(item => ({
                "ID": item.id || item.ID || '',
                "Category": item.category || item.Category || '',
                "Name": item.name || item.Name || '',
                "Freq": item.freq || item.Freq || '',
                "Elim": item.elim || item.Elim || '',
                "Sub": item.sub || item.Sub || '',
                "Eng": item.eng || item.Eng || '',
                "Admin": item.admin || item.Admin || '',
                "Ppe": item.ppe || item.Ppe || '',
                "Risk Level": item.risk || item.Risk || '',
                "UniqueKey": item.uniqueKey || ''
            }));
            let worksheet = XLSX.utils.json_to_sheet(exportData);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "ISO7010_Evaluation");
            XLSX.writeFile(workbook, `ISO7010_RiskEval_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
