<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>ISO7010 安全標誌管理系統</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f7f6; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #007bff; color: white; }
        .warning-sign { background: #fff3cd; }
    </style>
</head>
<body>

    <h2>ISO7010 安全標誌管理系統 (Phase 1 驗證)</h2>
    <div id="status">正在載入系統資料...</div>
    
    <table id="signTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Category</th>
                <th>Name</th>
                <th>Risk Level</th>
                <th>Freq</th>
                <th>Elim</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxb3cScYhic7VOl7nn0sgOFRuhiTiApcrwlDV9XTMA1UUD_pNZRBuywOAewUeAv1jWmrw/exec"; // 請替換您的 GAS 部署網址
        let masterData = [];

        async function initSystem() {
            try {
                document.getElementById('status').innerText = "正在連線 GAS 讀取資料...";
                let response = await fetch(GAS_URL);
                let result = await response.json();
                
                if (result.status === "success") {
                    // 1. 執行 W 類標誌動態展開 (1變4)
                    masterData = expandWSigns(result.data);
                    renderUI(masterData);
                    document.getElementById('status').innerText = `載入成功！總筆數（含展開）：${masterData.length}`;
                } else {
                    document.getElementById('status').innerText = "載入失敗：" + result.message;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "網路連線異常，請檢查主控台";
            }
        }

        // W類標誌規則：Category='Warning sign' 展開為 Risk 1~4，唯一鍵 = ID + Risk
        function expandWSigns(rawData) {
            let expanded = [];
            rawData.forEach(item => {
                if (item.category === 'Warning sign') {
                    for (let r = 1; r <= 4; r++) {
                        let cloneItem = Object.assign({}, item);
                        cloneItem.risk = `Risk ${r}`;
                        cloneItem.uniqueKey = `${cloneItem.id}-Risk${r}`;
                        expanded.push(cloneItem);
                    }
                } else {
                    item.uniqueKey = `${item.id}-${item.risk || 'Normal'}`;
                    expanded.push(item);
                }
            });
            return expanded;
        }

        function renderUI(data) {
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(item => {
                let tr = document.createElement('tr');
                if (item.category === 'Warning sign') tr.classList.add('warning-sign');
                
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.category}</td>
                    <td>${item.name}</td>
                    <td><strong>${item.risk || '-'}</strong></td>
                    <td>${item.freq || ''}</td>
                    <td>${item.elim || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = initSystem;
    </script>
</body>
</html>
