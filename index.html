<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO7010 - 完整安全標誌管理系統 (Phase 5)</title>
    <!-- 引入 SheetJS (xlsx.js) 用於直接產生 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f7f6; color: #333; }
        h2 { user-select: none; display: inline-block; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        input[type="text"], input[type="password"] { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: #28a745; color: white; }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; vertical-align: middle; }
        th { background: #007bff; color: white; }
        .warning-sign { background: #fff3cd; }
        #status { font-weight: bold; padding: 10px; background: #e2e3e5; border-radius: 4px; margin-bottom: 15px; }
        /* Modal 樣式 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 8px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .action-btn { padding: 4px 8px; font-size: 12px; margin: 2px; }
        .admin-only { display: none; }
        /* 雙擊互動提示樣式 (僅適用於 W 類別的風險等級互動格) */
        .dblclick-risk-cell { cursor: pointer; }
        .dblclick-risk-cell:hover { background-color: #fff0c2; }
    </style>
</head>
<body>

    <!-- Header -->
    <div>
        <h2 id="mainHeader">ISO7010 安全標誌管理系統</h2>
        <span id="adminBadge" style="font-size: 14px; color: red; font-weight: bold; margin-left: 10px; display: none;">(🔓 已登入管理者)</span>
    </div>
    <div id="status">正在初始化系統...</div>
    
    <!-- 工具列 -->
    <div class="toolbar">
        <button onclick="goBack()" style="background: #6c757d;">⬅️ 返回</button>
        <input type="text" id="searchInput" placeholder="輸入 ID 或名稱進行搜尋..." oninput="handleSearch()">
        <button onclick="startQRScanner()">開啟 QR 掃描</button>
        <button onclick="exportToExcel()" style="background: #17a2b8;">📥 匯出 Excel</button>
        <button onclick="openAdminModal()" style="background: #6c757d;">🔐 管理者中心</button>
        <button id="addBtn" class="admin-only" onclick="openAddModal()" style="background: #ffc107; color: #333;">➕ 新增標誌</button>
    </div>

    <!-- 主資料表格 -->
    <table id="signTable">
        <thead>
            <tr>
                <th>圖示預覽 / 風險等級</th>
                <th>ID</th>
                <th>Category</th>
                <th>Name</th>
                <th>Risk Level</th>
                <th>唯一鍵 (uniqueKey)</th>
                <th id="actionHeader" class="admin-only">管理者操作</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <!-- QR 掃描 Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h3>請對準 QR Code</h3>
            <video id="qrVideo" width="260" height="200" autoplay style="background:#000; border-radius:4px;"></video>
            <br><br>
            <button onclick="closeQRScanner()" style="background: #dc3545; width: 100%;">關閉相機</button>
        </div>
    </div>

    <!-- 管理者登入/設定 Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3>管理者中心</h3>
            <!-- 登入視圖 -->
            <div id="loginView">
                <p>請輸入管理員密碼 (預設為 0)：</p>
                <input type="password" id="pwdInput" placeholder="請輸入密碼" style="width: 93%; padding: 8px; margin-bottom: 10px;">
                <button onclick="verifyLogin()" style="width: 100%; margin-bottom: 5px; background: #007bff;">登入</button>
            </div>
            <!-- 管理控制視圖 (登入後顯示) -->
            <div id="controlView" class="admin-only" style="display: none;">
                <p style="color: green; font-weight: bold;">目前已獲得管理員權限</p>
                <hr style="border:0; border-top:1px solid #ddd; margin: 10px 0;">
                <h4>變更管理員密碼</h4>
                <input type="password" id="oldPwd" placeholder="請輸入舊密碼" style="width: 93%; padding: 6px; margin-bottom: 5px;">
                <input type="password" id="newPwd" placeholder="請輸入新密碼" style="width: 93%; padding: 6px; margin-bottom: 10px;">
                <button onclick="changePassword()" style="width: 100%; margin-bottom: 8px; background: #ffc107; color: #333;">確認修改密碼</button>
                <button onclick="adminLogout()" style="width: 100%; margin-bottom: 8px; background: #dc3545;">登出管理員</button>
            </div>
            <button onclick="document.getElementById('adminModal').style.display='none'" style="width: 100%; background: #6c757d; margin-top: 5px;">關閉視窗</button>
        </div>
    </div>

    <!-- 資料編輯 Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>編輯標誌資料</h3>
            <input type="hidden" id="editUniqueKey">
            <label style="font-size:12px; color:#666;">ID (不可修改)</label>
            <input type="text" id="editId" disabled style="width: 93%; padding: 6px; margin-bottom: 8px; background:#eee;">
            <label style="font-size:12px; color:#666;">Name</label>
            <input type="text" id="editName" style="width: 93%; padding: 6px; margin-bottom: 8px;">
            <label style="font-size:12px; color:#666;">Risk Level</label>
            <input type="text" id="editRisk" style="width: 93%; padding: 6px; margin-bottom: 15px;">
            <button onclick="saveEdit()" style="width: 100%; margin-bottom: 8px; background: #28a745;">儲存變更</button>
            <button onclick="document.getElementById('editModal').style.display='none'" style="width: 100%; background: #6c757d;">取消</button>
        </div>
    </div>

    <!-- 新增標誌 Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>新增安全標誌</h3>
            <label style="font-size:12px; color:#666;">ID (例如: P050)</label>
            <input type="text" id="addId" placeholder="輸入標誌代號" style="width: 93%; padding: 6px; margin-bottom: 8px;">
            <label style="font-size:12px; color:#666;">Category</label>
            <input type="text" id="addCategory" placeholder="例如: Warning sign / Prohibition" style="width: 93%; padding: 6px; margin-bottom: 8px;">
            <label style="font-size:12px; color:#666;">Name</label>
            <input type="text" id="addName" placeholder="輸入名稱說明" style="width: 93%; padding: 6px; margin-bottom: 8px;">
            <label style="font-size:12px; color:#666;">圖片網址 (svg_url)</label>
            <input type="text" id="addImg" placeholder="輸入圖片連結 (選填)" style="width: 93%; padding: 6px; margin-bottom: 15px;">
            <button onclick="submitAdd()" style="width: 100%; margin-bottom: 8px; background: #28a745;">確認新增</button>
            <button onclick="document.getElementById('addModal').style.display='none'" style="width: 100%; background: #6c757d;">取消</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxb3cScYhic7VOl7nn0sgOFRuhiTiApcrwlDV9XTMA1UUD_pNZRBuywOAewUeAv1jWmrw/exec"; 
        let masterData = [];
        let currentFilteredData = [];
        let mediaStream = null;
        let isAdmin = sessionStorage.getItem('isAdmin') === 'true';

        window.onload = function() {
            initPhase5();
            updateAdminUI();
        };

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                alert("目前已是首頁或無上一頁記錄");
            }
        }

        async function initPhase5() {
            try {
                document.getElementById('status').innerText = "正在向 GAS 發送請求...";
                let response = await fetch(GAS_URL);
                let result = await response.json();
                
                if (result.status === "success") {
                    masterData = expandWSigns(result.data);
                    renderUI(masterData);
                    document.getElementById('status').innerText = `✅ 系統就緒 | 總筆數（含展開）：${masterData.length} 筆`;
                } else {
                    document.getElementById('status').innerText = "❌ 載入失敗：" + result.message;
                }
            } catch (error) {
                console.error("連線錯誤：", error);
                document.getElementById('status').innerText = "❌ 網路連線異常，請按 F12 查看主控台。";
            }
        }

        function expandWSigns(rawData) {
            let expanded = [];
            rawData.forEach(item => {
                let rawCategory = item.category || item.Category || '';
                let cat = String(rawCategory).trim();

                if (cat === 'Warning sign') {
                    for (let r = 1; r <= 4; r++) {
                        let cloneItem = Object.assign({}, item);
                        cloneItem.risk = `Risk ${r}`;
                        let rowId = cloneItem.id || cloneItem.ID || 'unknown';
                        cloneItem.uniqueKey = `${rowId}-Risk${r}`;
                        expanded.push(cloneItem);
                    }
                } else {
                    let rowId = item.id || item.ID || 'unknown';
                    item.uniqueKey = `${rowId}-${item.risk || item.Risk || 'Normal'}`;
                    expanded.push(item);
                }
            });
            return expanded;
        }

        function renderUI(data) {
            currentFilteredData = data;
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let adminElements = document.querySelectorAll('.admin-only');
            adminElements.forEach(el => {
                if (el.id === 'controlView') return;

                if (el.tagName === 'TR' || el.tagName === 'DIV') {
                    el.style.display = isAdmin ? 'block' : 'none';
                } else {
                    el.style.display = isAdmin ? 'inline-block' : 'none';
                }
            });

            if (data.length === 0) {
                let colSpanCount = isAdmin ? 7 : 6;
                tbody.innerHTML = `<tr><td colspan="${colSpanCount}" style="color: #888;">找不到符合條件的資料</td></tr>`;
                return;
            }

            data.forEach(item => {
                let tr = document.createElement('tr');
                let rawCategory = item.category || item.Category || '';
                let isWarning = String(rawCategory).trim() === 'Warning sign';
                
                if (isWarning) {
                    tr.classList.add('warning-sign');
                }
                
                let imgUrl = item.svg_url || item.image || '';
                let rowId = item.id || item.ID || '';
                let rowName = item.name || item.Name || '';
                let rowRisk = item.risk || item.Risk || '-';

                let actionHtml = '';
                if (isAdmin) {
                    actionHtml = `<td>
                        <button class="action-btn" style="background:#ffc107; color:#333;" onclick="openEditModal('${item.uniqueKey}')">編輯</button>
                        <button class="action-btn" style="background:#dc3545;" onclick="deleteRow('${rowId}', '${rowRisk}')">刪除</button>
                    </td>`;
                }

                // 針對 W 類別的風險等級框格套用雙擊送審互動（一般類別則維持普通顯示）
                let riskCellHtml = `<strong>${rowRisk}</strong>`;
                if (isWarning) {
                    riskCellHtml = `<strong class="dblclick-risk-cell" ondblclick="submitRowAudit('${item.uniqueKey}')" title="雙擊此處可將此危害控制等級資料送審">${rowRisk} (可送審)</strong>`;
                }
                
                tr.innerHTML = `
                    <td>
                        ${imgUrl ? `<img src="${imgUrl}" width="35" height="35" style="object-fit:contain;" onerror="this.src='https://via.placeholder.com/35?text=NoImg'">` : '無'}
                        <div style="font-size: 11px; color: #555; margin-top: 3px; font-weight: bold;">${rowRisk}</div>
                    </td>
                    <td>${rowId}</td>
                    <td>${rawCategory}</td>
                    <td>${rowName}</td>
                    <td>${riskCellHtml}</td>
                    <td><small style="color: #666;">${item.uniqueKey}</small></td>
                    ${actionHtml}
                `;
                tbody.appendChild(tr);
            });
        }

        // W 類別風險等級框格雙擊送審動作
        async function submitRowAudit(uniqueKey) {
            let item = masterData.find(d => d.uniqueKey === uniqueKey);
            if (!item) return;

            let rowId = item.id || item.ID || '';
            let rowName = item.name || item.Name || '';
            let rowRisk = item.risk || item.Risk || '';

            let confirmAudit = confirm(`【W類別危害控制送審】\n您確定要將以下風險等級資料送出審核嗎？\n\n・ID: ${rowId}\n・名稱: ${rowName}\n・風險等級: ${rowRisk}`);
            if (!confirmAudit) return;

            document.getElementById('status').innerText = `⏳ 正在將 ID [${rowId}] (${rowRisk}) 送審中...`;

            try {
                let response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ 
                        action: 'auditRecord', 
                        id: rowId, 
                        risk: rowRisk,
                        name: rowName 
                    })
                });

                alert(`✅ ID [${rowId}] (${rowRisk}) 危害控制資料已成功送審！`);
                document.getElementById('status').innerText = `✅ 系統就緒 | 上次送審：ID ${rowId} (${rowRisk})`;
            } catch (e) {
                console.error("送審失敗：", e);
                alert("❌ 網路連線異常，送審失敗。");
                document.getElementById('status').innerText = "❌ 送審同步失敗";
            }
        }

        function handleSearch() {
            let keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = masterData.filter(item => 
                String(item.id || item.ID || '').toLowerCase().includes(keyword) || 
                String(item.name || item.Name || '').toLowerCase().includes(keyword)
            );
            renderUI(filtered);
        }

        async function startQRScanner() {
            let modal = document.getElementById('qrModal');
            let video = document.getElementById('qrVideo');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("您的瀏覽器不支援相機存取功能。");
                return;
            }
            try {
                modal.style.display = 'block';
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = mediaStream;
            } catch (error) {
                alert("無法開啟相機：您可能拒絕了相機權限，或裝置無相機。");
                closeQRScanner();
            }
        }

        function closeQRScanner() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById('qrVideo').srcObject = null;
            document.getElementById('qrModal').style.display = 'none';
        }

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'block';
            updateAdminUI();
        }

        function updateAdminUI() {
            let adminBadge = document.getElementById('adminBadge');
            if (adminBadge) {
                adminBadge.style.display = isAdmin ? 'inline' : 'none';
            }

            let loginView = document.getElementById('loginView');
            let controlView = document.getElementById('controlView');
            
            if (loginView && controlView) {
                if (isAdmin) {
                    loginView.style.display = 'none';
                    controlView.style.display = 'block';
                } else {
                    loginView.style.display = 'block';
                    controlView.style.display = 'none';
                }
            }

            let adminElements = document.querySelectorAll('.admin-only');
            adminElements.forEach(el => {
                if (el.id === 'controlView') return;

                if (el.tagName === 'TR' || el.tagName === 'DIV') {
                    el.style.display = isAdmin ? 'block' : 'none';
                } else {
                    el.style.display = isAdmin ? 'inline-block' : 'none';
                }
            });

            if (typeof renderUI === 'function' && typeof masterData !== 'undefined') {
                renderUI(masterData);
            }
        }

        function verifyLogin() {
            let inputPwd = document.getElementById('pwdInput').value;
            if (inputPwd === '0') {
                isAdmin = true;
                sessionStorage.setItem('isAdmin', 'true');
                
                alert("管理員登入成功！");
                
                document.getElementById('adminModal').style.display = 'none';
                document.getElementById('pwdInput').value = '';

                updateAdminUI();
            } else {
                alert("密碼錯誤！");
            }
        }

        async function changePassword() {
            let oldP = document.getElementById('oldPwd').value;
            let newP = document.getElementById('newPwd').value;
            if (!oldP || !newP) { alert("請完整輸入舊密碼與新密碼"); return; }
            try {
                let response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'updatePassword', oldPwd: oldP, newPwd: newP })
                });
                alert("密碼變更請求已送出！");
                document.getElementById('adminModal').style.display = 'none';
                document.getElementById('oldPwd').value = '';
                document.getElementById('newPwd').value = '';
            } catch (e) { alert("修改失敗，請檢查網路連線"); }
        }

        function adminLogout() {
            isAdmin = false;
            sessionStorage.removeItem('isAdmin');
            updateAdminUI();
            alert("已登出管理員");
            document.getElementById('adminModal').style.display = 'none';
        }

        function openEditModal(uniqueKey) {
            let item = masterData.find(d => d.uniqueKey === uniqueKey);
            if (!item) return;

            document.getElementById('editUniqueKey').value = uniqueKey;
            document.getElementById('editId').value = item.id || item.ID || '';
            document.getElementById('editName').value = item.name || item.Name || '';
            document.getElementById('editRisk').value = item.risk || item.Risk || '';
            document.getElementById('editModal').style.display = 'block';
        }

        async function saveEdit() {
            let uniqueKey = document.getElementById('editUniqueKey').value;
            let newName = document.getElementById('editName').value;
            let newRisk = document.getElementById('editRisk').value;
            let item = masterData.find(d => d.uniqueKey === uniqueKey);
            if (!item) return;

            let rowId = item.id || item.ID || '';

            try {
                document.getElementById('status').innerText = "正在儲存變更至試算表...";
                let response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'updateRecord', id: rowId, name: newName, risk: newRisk })
                });

                alert("已送出修改請求，請稍候重新整理以同步試算表資料。");
                document.getElementById('editModal').style.display = 'none';
                setTimeout(() => initPhase5(), 2000);
            } catch (e) {
                alert("連線錯誤，無法儲存");
                document.getElementById('status').innerText = "❌ 網路異常";
            }
        }

        async function deleteRow(id, risk) {
            if (!confirm(`確定要刪除 ID: ${id} (${risk}) 嗎？此動作無法復原！`)) return;

            try {
                document.getElementById('status').innerText = "正在刪除資料...";
                let response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: 'deleteRecord', id: id, risk: risk })
                });

                alert("已送出刪除請求，請稍候重新整理以同步試算表資料。");
                setTimeout(() => initPhase5(), 2000);
            } catch (e) {
                alert("連線錯誤，無法刪除");
                document.getElementById('status').innerText = "❌ 網路異常";
            }
        }

        function openAddModal() {
            document.getElementById('addId').value = '';
            document.getElementById('addCategory').value = '';
            document.getElementById('addName').value = '';
            document.getElementById('addImg').value = '';
            document.getElementById('addModal').style.display = 'block';
        }

        async function submitAdd() {
            let newId = document.getElementById('addId').value.trim();
            let newCat = document.getElementById('addCategory').value.trim();
            let newName = document.getElementById('addName').value.trim();
            let newImg = document.getElementById('addImg').value.trim();

            if (!newId || !newCat || !newName) {
                alert("請至少填寫 ID、Category 與 Name！");
                return;
            }

            let rawItem = {
                id: newId,
                category: newCat,
                name: newName,
                svg_url: newImg
            };

            let newExpandedItems = expandWSigns([rawItem]);

            masterData.push(...newExpandedItems);
            renderUI(masterData);

            document.getElementById('addModal').style.display = 'none';
            document.getElementById('status').innerText = `⏳ 正在將新標誌 [${newId}] 寫入 Google 試算表...`;

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ 
                        action: 'addRecord', 
                        id: newId, 
                        category: newCat, 
                        name: newName, 
                        svg_url: newImg 
                    })
                });

                alert(`✅ 標誌 [${newId}] 已成功新增並同步至雲端！`);
                document.getElementById('status').innerText = `✅ 系統就緒 | 總筆數（含展開）：${masterData.length} 筆`;

            } catch (e) {
                console.error("新增失敗：", e);
                alert("❌ 網路連線失敗，無法寫入雲端試算表");
                document.getElementById('status').innerText = "❌ 新增同步失敗，請檢查網路連線";
            }
        }

        function exportToExcel() {
            if (currentFilteredData.length === 0) {
                alert("目前沒有可匯出的資料！");
                return;
            }

            let exportData = currentFilteredData.map(item => ({
                "ID": item.id || item.ID || '',
                "Category": item.category || item.Category || '',
                "Name": item.name || item.Name || '',
                "Risk Level": item.risk || item.Risk || '',
                "UniqueKey": item.uniqueKey || ''
            }));

            let worksheet = XLSX.utils.json_to_sheet(exportData);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "ISO7010_Signs");

            let fileName = `ISO7010_Export_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }
    </script>
</body>
</html>
