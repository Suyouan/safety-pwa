<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點讀筆聲音告示牌對照表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Html5-Qrcode (用於相機掃描) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .page-break {
            page-break-after: always;
        }
        @media print {
            body {
                background: white;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .shadow-xl, .shadow-md, .shadow-sm {
                box-shadow: none !important;
            }
            .border {
                border-color: #000 !important;
            }
        }
        /* 確保 html5-qrcode 裡面的 video 填滿容器且不變形 */
        #reader video {
            object-fit: cover;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <!-- 頂部導覽列 (不列印) -->
    <header class="bg-indigo-900 text-white shadow-lg no-print sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="volume-2" class="w-8 h-8 text-amber-400"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">點讀筆聲音告示牌對照系統</h1>
                    <p class="text-xs text-indigo-200">聲音檔編號與實體告示牌對應檢索</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="btn-camera" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 transition text-sm shadow">
                    <i data-lucide="camera" class="w-4 h-4"></i>
                    <span>掃描 QR</span>
                </button>
                <button id="btn-print" class="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-2 rounded-lg flex items-center gap-1.5 transition text-sm border border-indigo-500">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    <span>列印本頁</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 相機 Modal (不列印) -->
    <div id="modal-camera" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-xl max-w-md w-full p-4 relative shadow-2xl">
            <button id="btn-close-camera" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 p-1">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-lg font-bold mb-3 text-slate-800 flex items-center gap-2">
                <i data-lucide="scan" class="w-5 h-5 text-indigo-600"></i>
                掃描告示牌 QR Code
            </h3>
            <!-- 修改點：使用 aspect-square 確保畫面保持 1:1 正方形區域，解決長方形變形問題 -->
            <div id="reader" class="w-full aspect-square max-h-[60vh] bg-black rounded-lg overflow-hidden"></div>
            <p class="text-xs text-slate-500 mt-3 text-center">請將對照表上的 QR Code 對準鏡頭中央即可自動跳轉</p>
        </div>
    </div>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-4 mt-6">

        <!-- 搜尋與篩選列 (不列印) -->
        <section class="bg-white rounded-xl p-4 md:p-6 shadow-sm border border-slate-200 mb-6 no-print">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                
                <!-- 搜尋框 -->
                <div class="md:col-span-5 relative">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">關鍵字搜尋 (標題 / 語音內容)</label>
                    <div class="relative">
                        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-2.5 text-slate-400"></i>
                        <input type="text" id="input-search" placeholder="輸入告示牌名稱或語音內容..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                </div>

                <!-- 選擇告示牌編號 -->
                <div class="md:col-span-4">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">直接選擇告示牌編號</label>
                    <select id="select-sign" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        <option value="">-- 顯示全部 (清單模式) --</option>
                    </select>
                </div>

                <!-- 模式切換 -->
                <div class="md:col-span-3 flex items-end gap-2">
                    <button id="btn-mode-all" class="flex-1 py-2 px-3 bg-indigo-50 text-indigo-700 font-semibold border border-indigo-200 rounded-lg text-sm flex items-center justify-center gap-1">
                        <i data-lucide="list" class="w-4 h-4"></i>
                        <span>總覽模式</span>
                    </button>
                    <button id="btn-reset" class="py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm transition" title="重設條件">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>

            </div>
        </section>

        <!-- 視圖 1: 單一告示牌詳細模式 (適合點對點查看或列印單張) -->
        <article id="view-single" class="hidden">
            <div class="bg-white rounded-xl border-2 border-indigo-600 shadow-md overflow-hidden max-w-2xl mx-auto">
                <div class="bg-indigo-600 text-white p-4 flex justify-between items-center">
                    <span id="single-id" class="text-xl font-black bg-white text-indigo-900 px-3 py-1 rounded-md shadow-inner"></span>
                    <span class="text-sm font-medium bg-indigo-700 px-3 py-1 rounded-full text-indigo-100">告示牌聲音對照卡</span>
                </div>
                
                <div class="p-6 space-y-6">
                    <div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">告示牌名稱</h2>
                        <p id="single-title" class="text-2xl font-bold text-slate-800"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <div>
                            <span class="text-xs text-slate-500 block">點讀筆語音檔編號</span>
                            <span id="single-audio-id" class="text-xl font-bold text-indigo-600 font-mono"></span>
                        </div>
                        <div>
                            <span class="text-xs text-slate-500 block">告示牌類別</span>
                            <span id="single-category" class="text-sm font-semibold text-slate-700"></span>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1">
                            <i data-lucide="file-text" class="w-4 h-4"></i>
                            點讀筆語音播報逐字稿
                        </h3>
                        <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 text-slate-800 text-base leading-relaxed" id="single-script">
                        </div>
                    </div>

                    <!-- 附帶 QR Code 區域 (方便列印後掃描對照) -->
                    <div class="pt-4 border-t border-slate-200 flex justify-between items-center">
                        <div class="text-xs text-slate-400">
                            <p>點讀筆專用系統對照表</p>
                            <p>掃描右側 QR 可直接於手機開啟此牌</p>
                        </div>
                        <div id="single-qrcode" class="w-20 h-20 bg-slate-100 border p-1 rounded"></div>
                    </div>
                </div>
            </div>
        </article>

        <!-- 視圖 2: 全部/搜尋結果表格模式 (適合總覽、批次列印) -->
        <article id="view-table" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <span class="text-sm font-bold text-slate-700">資料列表 (<span id="count-total">0</span> 筆)</span>
                <span class="text-xs text-slate-500 no-print">可點擊列表快速檢視單一告示牌</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="p-3 font-bold w-24">告示牌 ID</th>
                            <th class="p-3 font-bold w-32">音檔編號</th>
                            <th class="p-3 font-bold w-48">告示牌名稱</th>
                            <th class="p-3 font-bold">點讀筆語音逐字稿</th>
                            <th class="p-3 font-bold w-24 text-center no-print">操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-200 text-sm">
                        <!-- 由 JS 動態生成 -->
                    </tbody>
                </table>
            </div>
        </article>

    </main>

    <!-- 腳本 -->
    <script>
        // 1. 假資料庫 (預設對照表)
        const SIGNS_DATA = [
            { id: "SIGN-001", audioId: "AUD-001", title: "主要入口指示牌", category: "導覽告示", script: "歡迎光臨！本園區開放時間為上午九點至下午五點，請勿攜帶寵物入園。" },
            { id: "SIGN-002", audioId: "AUD-002", title: "緊急避難圖", category: "安全告示", script: "緊急避難位置提示：若發生地震或火災，請保持冷靜，順著綠色指示燈前往中央草坪集結。" },
            { id: "SIGN-003", audioId: "AUD-003", title: "無障礙電梯說明", category: "設施告示", script: "本電梯為無障礙優先電梯，設有低位按鈕與語音提示，請優先讓行動不便者使用。" },
            { id: "SIGN-004", audioId: "AUD-004", title: "洗手間與哺集乳室", category: "設施告示", script: "前方左轉為男女洗手間，右側設有獨立哺集乳室，配有熱水器與換尿布台。" },
            { id: "SIGN-005", audioId: "AUD-005", title: "生態池注意事項", category: "警示告示", script: "水深危險！請勿靠近池邊嬉戲，嚴禁餵食池內魚類與野生鴨子。" },
            { id: "SIGN-006", audioId: "AUD-006", title: "歷史展覽館介紹", category: "景點介紹", script: "本展館建於1920年，展示了在地產業發展史。請勿在館內飲食或使用閃光燈拍照。" },
            { id: "SIGN-007", audioId: "AUD-007", title: "垃圾分類回收站", category: "環境告示", script: "請做好垃圾分類，由左至右分別為：一般垃圾、資源回收、以及廚餘回收桶。" }
        ];

        // 全域變數
        let currentSearch = "";
        let activeSignId = "";
        let currentViewMode = "ALL"; // 'ALL' 或 'SINGLE'
        let html5QrCode = null;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            populateSelectOptions();
            renderCurrentView();

            // 綁定事件
            document.getElementById("input-search").addEventListener("input", (e) => {
                currentSearch = e.target.value.trim().toLowerCase();
                currentViewMode = "ALL";
                activeSignId = "";
                document.getElementById("select-sign").value = "";
                renderCurrentView();
            });

            document.getElementById("select-sign").addEventListener("change", (e) => {
                activeSignId = e.target.value;
                if(activeSignId) {
                    currentViewMode = "SINGLE";
                } else {
                    currentViewMode = "ALL";
                }
                renderCurrentView();
            });

            document.getElementById("btn-mode-all").addEventListener("click", () => {
                currentViewMode = "ALL";
                activeSignId = "";
                document.getElementById("select-sign").value = "";
                renderCurrentView();
            });

            document.getElementById("btn-reset").addEventListener("click", () => {
                currentSearch = "";
                activeSignId = "";
                currentViewMode = "ALL";
                document.getElementById("input-search").value = "";
                document.getElementById("select-sign").value = "";
                renderCurrentView();
            });

            document.getElementById("btn-print").addEventListener("click", () => {
                window.print();
            });

            // 相機開關邏輯 (已優化掃描框為正方形)
            document.getElementById("btn-camera").addEventListener("click", () => {
                const modalCam = document.getElementById("modal-camera");
                modalCam.classList.remove("hidden");
                
                html5QrCode = new Html5Qrcode("reader");
                
                // 動態計算 qrbox 的尺寸，確保在任何螢幕長寬比下皆為完美的正方形
                const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
                    let minEdgePercentage = 0.7; // 佔用取景視窗較短邊的 70%
                    let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
                    let qrboxSize = Math.floor(minEdgeSize * minEdgePercentage);
                    return {
                        width: qrboxSize,
                        height: qrboxSize
                    };
                };

                html5QrCode.start(
                    { facingMode: "environment" }, 
                    { 
                        fps: 10, 
                        qrbox: qrboxFunction,
                        aspectRatio: 1.0 // 強制保持正方形比例
                    },
                    (decodedText, decodedResult) => {
                        // 成功掃描到的處理
                        html5QrCode.stop();
                        modalCam.classList.add("hidden");
                        
                        // 簡單搜尋匹配：直接比對 ID 或純文字
                        const found = SIGNS_DATA.find(s => s.id === decodedText || decodedText.includes(s.id));
                        if(found) {
                            activeSignId = found.id;
                            currentViewMode = "SINGLE";
                            document.getElementById("select-sign").value = found.id;
                        } else {
                            alert("掃描成功，內容為：" + decodedText + "\n未在預設資料庫中找到精確匹配，將為您帶入搜尋。");
                            document.getElementById("input-search").value = decodedText;
                            currentSearch = decodedText.toLowerCase();
                            currentViewMode = "ALL";
                        }
                        renderCurrentView();
                    },
                    (errorMessage) => {
                        // 掃描過程中的失敗/持續對焦，通常不處理
                    }
                ).catch(err => {
                    alert("無法啟動相機，請確認已給予相機權限。");
                    modalCam.classList.add("hidden");
                });
            });

            document.getElementById("btn-close-camera").addEventListener("click", () => {
                if(html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().then(() => {
                        document.getElementById("modal-camera").classList.add("hidden");
                    });
                } else {
                    document.getElementById("modal-camera").classList.add("hidden");
                }
            });
        });

        // 填滿下拉選單
        function populateSelectOptions() {
            const select = document.getElementById("select-sign");
            SIGNS_DATA.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.id;
                opt.textContent = `${item.id} - ${item.title}`;
                select.appendChild(opt);
            });
        }

        // 渲染畫面
        function renderCurrentView() {
            const viewSingle = document.getElementById("view-single");
            const viewTable = document.getElementById("view-table");

            if (currentViewMode === "SINGLE" && activeSignId) {
                const item = SIGNS_DATA.find(s => s.id === activeSignId);
                if (item) {
                    viewSingle.classList.remove("hidden");
                    viewTable.classList.add("hidden");

                    document.getElementById("single-id").textContent = item.id;
                    document.getElementById("single-title").textContent = item.title;
                    document.getElementById("single-audio-id").textContent = item.audioId;
                    document.getElementById("single-category").textContent = item.category;
                    document.getElementById("single-script").textContent = item.script;
                    
                    // 簡易 QR code 圖片生成 (使用外部 API)
                    const qrContainer = document.getElementById("single-qrcode");
                    qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(item.id)}" alt="QR" class="w-full h-full object-contain"/>`;
                }
            } else {
                // ALL 模式
                viewSingle.classList.add("hidden");
                viewTable.classList.remove("hidden");

                // 篩選資料
                const filtered = SIGNS_DATA.filter(item => {
                    const matchSearch = item.title.toLowerCase().includes(currentSearch) || 
                                        item.script.toLowerCase().includes(currentSearch) ||
                                        item.id.toLowerCase().includes(currentSearch) ||
                                        item.audioId.toLowerCase().includes(currentSearch);
                    return matchSearch;
                });

                document.getElementById("count-total").textContent = filtered.length;

                const tbody = document.getElementById("table-body");
                tbody.innerHTML = "";

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">找不到符合條件的告示牌資料</td></tr>`;
                    return;
                }

                filtered.forEach(item => {
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-50 transition cursor-pointer";
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-indigo-700 font-mono">${item.id}</td>
                        <td class="p-3 font-mono text-slate-600">${item.audioId}</td>
                        <td class="p-3 font-semibold text-slate-800">${item.title}</td>
                        <td class="p-3 text-slate-600 max-w-md truncate" title="${item.script}">${item.script}</td>
                        <td class="p-3 text-center no-print">
                            <button onclick="selectSingleSign('${item.id}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2.5 py-1 rounded border border-indigo-200 transition">
                                查看
                            </button>
                        </td>
                    `;
                    // 點擊整行直接開啟單一檢視
                    tr.addEventListener("click", (e) => {
                        if(e.target.tagName !== 'BUTTON') {
                            selectSingleSign(item.id);
                        }
                    });
                    tbody.appendChild(tr);
                });
            }
            lucide.createIcons();
        }

        // 全域切換選擇特定項目的 function
        function selectSingleSign(id) {
            activeSignId = id;
            currentViewMode = "SINGLE";
            document.getElementById("select-sign").value = id;
            renderCurrentView();
        }
    </script>
</body>
</html>
