<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO7010 安全標誌管理系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 頂部導覽列 -->
    <header id="main-header">
        <h1 id="header-title">ISO7010 安全標誌管理系統</h1>
        <div id="header-actions">
            <span id="pending-badge" style="display:none;">待審批: 0</span>
        </div>
    </header>

    <!-- 主要內容動態容器 (SPA 視圖) -->
    <main id="app-container">
        <!-- 載入中畫面 -->
        <div id="loading-view" class="view active">
            <p>正在載入系統資料，請稍候...</p>
        </div>
    </main>

    <!-- 審批 Modal -->
    <div id="approval-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>管理員審批後台</h2>
            <div id="approval-list"></div>
            <button id="close-modal-btn">關閉</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
