<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ISO7010 Safety PWA</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

<script src="https:pkg.com/html5-qrcode>

<script src="https://cdn.jsdelivr.net/npm/ist/xlsx.full.min.js>

<style>

body{
    background:#f5f5f5;
    margin:0;
    padding:0;
}

.sign-card{
    background:white;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.risk-level{
    font-size:20px;
    font-weight:bold;
    color:#d97706;
}

.editable:hover{
    background:#eef;
    cursor:pointer;
}

.modal-bg{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-panel{
    background:white;
    width:90%;
    max-width:900px;
    max-height:90vh;
    overflow:auto;
    border-radius:10px;
    padding:20px;
}

.badge{
    background:red;
    color:white;
    border-radius:999px;
    padding:2px 8px;
    font-size:12px;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="bg-blue-600 text-white p-4 flex justify-between items-center">

    <div id="header-title-container">
        <h1 class="text-xl font-bold">
            ISO7010 Safety
        </h1>
    </div>

    <div class="flex gap-2">

        <select id="langSelector" class="text-black px-2 rounded">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
        </select>

        <button id="databaseBtn"
            class="bg-white text-blue-600 px-3 rounded">
            Database
        </button>

        <button id="scanBtn"
            class="bg-white text-blue-600 px-3 rounded">
            Scan QR
        </button>

        <button id="exportBtn"
            class="bg-green-500 px-3 rounded">
            XLSX
        </button>

        <div id="pendingBadge"
             class="badge">
             0
        </div>

    </div>

</div>

<!-- SEARCH -->

<div class="p-4">

<input
id="searchInput"
type="text"
placeholder="Search..."
class="border p-2 w-full rounded">

</div>

<!-- MAIN -->

<div id="mainContent"
     class="p-4">

</div>

<!-- DATABASE VIEW -->

<div
id="databaseView"
class="hidden p-4">

<div id="signGrid"
     class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">

</div>

</div>

<!-- QR SCANNER -->

<div id="qrReaderContainer"
     class="hidden p-4">

<div id="qr-reader"></div>

</div>

<!-- APPROVAL MODAL -->

<div
id="approvalModal"
class="modal-bg">

<div class="modal-panel">

<div class="flex justify-between">

<h2 class="font-bold text-xl">
Pending Approvals
</h2>

<button id="closeApprovalBtn">
✕
</button>

</div>

<hr class="my-4">

<div id="approvalList"></div>

</div>

</div>

<script>

/****************************************
CONFIG
****************************************/

const GAS_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxb3cScYhic7VOl7nn0sgOFRuhiTiApcrwlDV9XTMA1UUD_pNZRBuywOAewUeAv1jWmrw/exec";

/****************************************
GLOBAL STATES
****************************************/

let isoSignsData = [];

let dynamicSubDirectories = [];

let currentViewMode = "DATABASE";

let activeSignId = null;

let currentLang = "zh";

let lastDataSnapshot = "";

let qrScanner = null;

/****************************************
I18N
****************************************/

const i18nDict = {

    zh:{
        risk:"風險等級",
        database:"資料庫",
        search:"搜尋"
    },

    en:{
        risk:"Risk Level",
        database:"Database",
        search:"Search"
    },

    de:{
        risk:"Risikostufe",
        database:"Datenbank",
        search:"Suche"
    }

};

/****************************************
FETCH ISO DATA
****************************************/

async function fetchSignsFromSheet(){

    try{

        const res = await fetch(
            `${GAS_WEB_APP_URL}?action=SIGNS`
        );

        isoSignsData = await res.json();

    }catch(err){

        console.error(err);

    }

}

/****************************************
EXPAND W SIGNS
****************************************/

function expandWSigns(){

    const expanded = [];

    isoSignsData.forEach(sign=>{

        if(
            sign.category &&
            sign.category.trim() === "Warning sign"
        ){

            for(let risk=1;risk<=4;risk++){

                expanded.push({
                    ...sign,
                    risk:risk.toString()
                });

            }

        }else{

            expanded.push(sign);

        }

    });

    isoSignsData = expanded;

}

/****************************************
LOAD APPROVED DATA
****************************************/

async function fetchGASData(){

    try{

        const res =
        await fetch(
            `${GAS_WEB_APP_URL}?action=APPROVED`
        );

        dynamicSubDirectories =
        await res.json();

        mergeApprovedData();

    }
    catch(err){

        console.error(err);

    }

}

/****************************************
MERGE APPROVED DATA
****************************************/

function mergeApprovedData(){

    const snapshot =
    JSON.stringify(dynamicSubDirectories);

    if(snapshot === lastDataSnapshot){

        return;

    }

    lastDataSnapshot = snapshot;

    isoSignsData.forEach(sign=>{

        dynamicSubDirectories.forEach(item=>{

            if(
                item.ID === sign.id &&
                item.Risk === String(sign.risk)
            ){

                sign[item.Field] =
                item.Value;

            }

        });

    });

    if(currentViewMode==="DATABASE"){

        renderDatabase();

    }else{

        renderSingleSign(
            activeSignId
        );

    }

}

/****************************************
RENDER DATABASE
****************************************/

function renderDatabase(){

    currentViewMode =
    "DATABASE";

    document
        .getElementById("databaseView")
        .classList.remove("hidden");

    document
        .getElementById("mainContent")
        .innerHTML = "";

    const grid =
    document.getElementById(
        "signGrid"
    );

    grid.innerHTML = "";

    isoSignsData.forEach(sign=>{

        const card =
        document.createElement("div");

        card.className =
        "sign-card p-2 cursor-pointer";

        card.innerHTML = `
<img
src="${sign.svg_url}"
class="w-full h-32 object-contain">

            <div class="mt-2 text-center">

                <div class="
                    font-bold
                    text-sm">

                    ${sign.id}
                </div>

                <div class="
                    text-xs
                    mt-1">

                    ${sign.name}
                </div>

                ${
                    sign.category==="Warning sign"
                    ?
                    `<div class="risk-level">
                        Risk ${sign.risk}
                     </div>`
                    :
                    ""
                }

            </div>
        `;

        card.onclick = ()=>{

            renderSingleSign(
                sign.id,
                sign.risk
            );

        };

        grid.appendChild(card);

    });

}

/****************************************
RENDER SINGLE SIGN
****************************************/

function renderSingleSign(
    id,
    risk=null
){

    currentViewMode =
    "SINGLE";

    activeSignId = id;

    document
      .getElementById(
        "databaseView"
      )
      .classList.add("hidden");

    const sign =
    isoSignsData.find(s=>{

        if(risk){

            return (
                s.id===id &&
                String(s.risk)===String(risk)
            );

        }

        return s.id===id;

    });

    if(!sign){

        return;

    }

    let riskHtml = "";

    if(
        sign.category==="Warning sign"
    ){

        riskHtml = `
            <div class="
                text-center mt-4">

                <div class="
                    risk-level">

                    ${
                        i18nDict[currentLang]
                        .risk
                    }
                    ${sign.risk}

                </div>

            </div>
        `;

    }

    document
      .getElementById(
          "mainContent"
      )
      .innerHTML = `

    <div class="
        sign-card p-6">

        <div class="
             flex justify-center">

            <img
alt="${sign.id}"
class="max-w-64 max-h-64">

        </div>

        ${riskHtml}

        <div class="
             text-center
             font-bold
             text-2xl
             mt-4">

             ${sign.id}

        </div>

        <div class="
             text-center
             mt-2">

             ${sign.name}

        </div>

        <div class="
             mt-6
             grid
             gap-2">

             ${renderControlField(
                sign,
                'freq',
                'Frequency'
             )}

             ${renderControlField(
                sign,
                'elim',
                'Elimination'
             )}

             ${renderControlField(
                sign,
                'sub',
                'Substitution'
             )}

             ${renderControlField(
                sign,
                'eng',
                'Engineering'
             )}

             ${renderControlField(
                sign,
                'admin',
                'Administrative'
             )}

             ${renderControlField(
                sign,
                'ppe',
                'PPE'
             )}

        </div>

    </div>

    `;

}

/****************************************
FIELD UI
****************************************/

function renderControlField(
    sign,
    field,
    title
){

    return `
        <div
        class="
          editable
          border
          p-3
          rounded"
        ondblclick=
        "editField(
            '${sign.id}',
            '${sign.risk}',
            '${field}'
        )">

            <b>${title}</b>

            <div>

            ${
              sign[field] || ""
            }

            </div>

        </div>
    `;

}

/****************************************
SEARCH
****************************************/

function searchSigns(keyword){

    keyword =
    keyword.toLowerCase();

    const result =
    isoSignsData.filter(sign=>{

        return (

          sign.id
          .toLowerCase()
          .includes(keyword)

          ||

          sign.name
          .toLowerCase()
          .includes(keyword)

        );

    });

    const grid =
    document.getElementById(
        "signGrid"
    );

    grid.innerHTML = "";

    result.forEach(sign=>{

        const div =
        document.createElement("div");

        div.className =
        "sign-card p-2";

        div.innerHTML = `
            ${sign.svg_url}

            <div class="text-center">

                ${sign.id}

            </div>
        `;

        div.onclick=()=>{

            renderSingleSign(
                sign.id,
                sign.risk
            );

        };

        grid.appendChild(div);

    });

}

/****************************************
URL PARSE
****************************************/

function parseUrlSign(){

    const params =
    new URLSearchParams(
        window.location.search
    );

    const id =
    params.get("id");

    if(!id){

        return;

    }

    const sign =
    isoSignsData.find(
      x=>x.id===id
    );

    if(sign){

        renderSingleSign(
            sign.id,
            sign.risk
        );

    }

}

  /****************************************
EDIT FIELD
****************************************/

async function editField(
    signId,
    risk,
    field
){

    const sign =
    isoSignsData.find(s=>

        s.id===signId &&
        String(s.risk)===String(risk)

    );

    if(!sign){

        return;

    }

    const currentValue =
    sign[field] || "";

    const newValue =
    prompt(
        `Edit ${field}`,
        currentValue
    );

    if(
        newValue===null
    ){
        return;
    }

    const applicant =
    prompt(
        "Applicant Name",
        ""
    );

    if(
        !applicant
    ){
        return;
    }

    if(
        !confirm(
        "Submit Change Request?"
        )
    ){
        return;
    }

    await submitRequest({
        signId,
        risk,
        field,
        value:newValue,
        applicant
    });

}

/****************************************
SUBMIT REQUEST
****************************************/

async function submitRequest(
    payload
){

    try{

        const res =
        await fetch(
            GAS_WEB_APP_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({

                    action:"SUBMIT",

                    ...payload

                })
            }
        );

        const result =
        await res.json();

        if(result.success){

            alert(
              "Submitted"
            );

            await fetchGASData();

            await fetchPendingCount();

        }

    }
    catch(err){

        console.error(err);

        alert(
          "Submit Failed"
        );

    }

}

/****************************************
PENDING COUNT
****************************************/

async function fetchPendingCount(){

    try{

        const res =
        await fetch(
            `${GAS_WEB_APP_URL}?action=PENDINGCOUNT`
        );

        const data =
        await res.json();

        document
        .getElementById(
            "pendingBadge"
        )
        .innerText =
        data.count || 0;

    }
    catch(err){

        console.error(err);

    }

}

/****************************************
OPEN APPROVAL MODAL
****************************************/

async function openApprovalModal(){

    try{

        document
          .getElementById(
             "approvalModal"
          )
          .style.display =
          "flex";

        const res =
        await fetch(
            `${GAS_WEB_APP_URL}?action=PENDING`
        );

        const data =
        await res.json();

        renderPendingList(
            data
        );

    }
    catch(err){

        console.error(err);

    }

}

/****************************************
PENDING UI
****************************************/

function renderPendingList(
    rows
){

    const container =
    document.getElementById(
        "approvalList"
    );

    container.innerHTML="";

    rows.forEach(row=>{

        const item =
        document.createElement(
            "div"
        );

        item.className =
        "border p-3 rounded mb-3";

        item.innerHTML = `

            <div>

                <b>
                ${row.signId}
                </b>

                ${
                  row.risk
                  ?
                  `(Risk ${row.risk})`
                  :
                  ''
                }

            </div>

            <div>
                Field:
                ${row.field}
            </div>

            <div>
                Value:
                ${row.value}
            </div>

            <div>
                Applicant:
                ${row.applicant}
            </div>

            <div class="
                mt-3 flex gap-2">

                <button
                class="
                bg-green-500
                text-white
                px-3 py-1 rounded"
                onclick="
                    reviewRequest(
                    '${row.rowId}',
                    'APPROVED'
                    )
                ">

                APPROVED

                </button>

                <button
                class="
                bg-red-500
                text-white
                px-3 py-1 rounded"
                onclick="
                    reviewRequest(
                    '${row.rowId}',
                    'REJECTED'
                    )
                ">

                REJECTED

                </button>

            </div>

        `;

        container.appendChild(
            item
        );

    });

}

/****************************************
REVIEW REQUEST
****************************************/

async function reviewRequest(
    rowId,
    reviewStatus
){

    const reviewer =
    prompt(
        "Reviewer",
        ""
    );

    if(
        !reviewer
    ){
        return;
    }

    try{

        const res =
        await fetch(
            GAS_WEB_APP_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    action:
                    "REVIEW",

                    rowId,

                    reviewStatus,

                    reviewer

                })

            }
        );

        const result =
        await res.json();

        if(result.success){

            await openApprovalModal();

            await fetchGASData();

            await fetchPendingCount();

        }

    }
    catch(err){

        console.error(err);

    }

}

/****************************************
HEADER LONG PRESS
****************************************/

function setupHeaderLongPress(){

    const header =
    document.getElementById(
        "header-title-container"
    );

    let timer = null;

    header.addEventListener(
        "mousedown",
        ()=>{

            timer =
            setTimeout(
                ()=>{

                    openApprovalModal();

                },
                3000
            );

        }
    );

    header.addEventListener(
        "mouseup",
        ()=>{

            clearTimeout(
                timer
            );

        }
    );

    header.addEventListener(
        "mouseleave",
        ()=>{

            clearTimeout(
                timer
            );

        }
    );

    header.addEventListener(
        "touchstart",
        ()=>{

            timer =
            setTimeout(
                ()=>{

                    openApprovalModal();

                },
                3000
            );

        }
    );

    header.addEventListener(
        "touchend",
        ()=>{

            clearTimeout(
                timer
            );

        }
    );

}

/****************************************
CLOSE MODAL
****************************************/

function closeApprovalModal(){

    document
      .getElementById(
          "approvalModal"
      )
      .style.display =
      "none";

}

  /****************************************
QR SCANNER
****************************************/

function startQrScanner(){

    document
      .getElementById(
        "qrReaderContainer"
      )
      .classList.remove(
        "hidden"
      );

    if(qrScanner){

        qrScanner.stop();

    }

    qrScanner =
    new Html5Qrcode(
        "qr-reader"
    );

    qrScanner.start(

        {
            facingMode:
            "environment"
        },

        {
            fps:10,
            qrbox:250
        },

        qrText => {

            handleQrResult(
                qrText
            );

        },

        err => {}

    );

}

function handleQrResult(
    qrText
){

    try{

        const url =
        new URL(qrText);

        const id =
        url.searchParams.get(
            "id"
        );

        if(!id){

            alert(
                "Invalid QR"
            );

            return;

        }

        const sign =
        isoSignsData.find(
            x=>x.id===id
        );

        if(sign){

            renderSingleSign(
                sign.id,
                sign.risk
            );

        }

        if(qrScanner){

            qrScanner.stop();

        }

    }
    catch(err){

        console.error(err);

        alert(
            "Invalid QR"
        );

    }

}

/****************************************
XLSX EXPORT
****************************************/

async function exportExcel(){

    await fetchGASData();

    const rows = [];

    isoSignsData.forEach(sign=>{

        rows.push({

            ID:sign.id,

            Category:
            sign.category,

            Risk:
            sign.risk || "",

            Name:
            sign.name,

            Frequency:
            sign.freq || "",

            Elimination:
            sign.elim || "",

            Substitution:
            sign.sub || "",

            Engineering:
            sign.eng || "",

            Administrative:
            sign.admin || "",

            PPE:
            sign.ppe || ""

        });

    });

    const ws =
    XLSX.utils.json_to_sheet(
        rows
    );

    const wb =
    XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(

        wb,

        ws,

        "ISO7010"

    );

    const today =
    new Date();

    const ts =
        today
        .toISOString()
        .replace(/[-:]/g,"")
        .replace("T","_")
        .substring(0,15);

    XLSX.writeFile(

        wb,

        `ISO7010_Database_${ts}.xlsx`

    );

}

/****************************************
LANGUAGE
****************************************/

function initI18n(){

    document
      .getElementById(
        "langSelector"
      )
      .addEventListener(

        "change",

        e=>{

            currentLang =
            e.target.value;

            if(
              currentViewMode
              ==="DATABASE"
            ){

                renderDatabase();

            }
            else{

                const sign =
                isoSignsData.find(
                    x=>x.id===activeSignId
                );

                if(sign){

                    renderSingleSign(
                        sign.id,
                        sign.risk
                    );

                }

            }

        }

    );

}

/****************************************
EVENT LISTENERS
****************************************/

function setupEventListeners(){

    document
      .getElementById(
        "databaseBtn"
      )
      .addEventListener(

        "click",

        ()=>{

            renderDatabase();

        }

    );

    document
      .getElementById(
        "scanBtn"
      )
      .addEventListener(

        "click",

        ()=>{

            startQrScanner();

        }

    );

    document
      .getElementById(
        "exportBtn"
      )
      .addEventListener(

        "click",

        exportExcel

    );

    document
      .getElementById(
        "closeApprovalBtn"
      )
      .addEventListener(

        "click",

        closeApprovalModal

    );

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(

        "input",

        e=>{

            searchSigns(

                e.target.value

            );

        }

    );

}

/****************************************
PWA REGISTER
****************************************/

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(

        "load",

        ()=>{

            navigator
            .serviceWorker
            .register(

              "./sw.js"

            )
            .then(()=>{

                console.log(
                  "SW Registered"
                );

            })
            .catch(err=>{

                console.error(
                    err
                );

            });

        }

    );

}

/****************************************
HELPER
****************************************/

function showToast(msg){

    console.log(msg);

}

/****************************************
END
****************************************/

</script>

</body>

</html>
