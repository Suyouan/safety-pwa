<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
ISO7010 Safety PWA
</title>

https://cdn.tailwindcss.com

</head>

<body class="bg-gray-100">

<header
class="bg-blue-600 text-white p-4">

<h1 class="text-xl font-bold">

ISO7010 Safety PWA

</h1>

</header>

<div class="p-4">

<button
onclick="loadSigns()"
class="bg-blue-600 text-white px-4 py-2 rounded">

Load Data

</button>

</div>

<div
id="status"
class="p-4 text-sm">

Ready

</div>

<div
id="grid"
class="
grid
grid-cols-2
md:grid-cols-4
gap-4
p-4">

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxb3cScYhic7VOl7nn0sgOFRuhiTiApcrwlDV9XTMA1UUD_pNZRBuywOAewUeAv1jWmrw/exec";

let isoSignsData = [];

async function loadSigns(){

    document
    .getElementById("status")
    .innerText =
    "Loading...";

    try{

        const response =
        await fetch(
            GAS_URL +
            "?action=SIGNS"
        );

        isoSignsData =
        await response.json();

        renderSigns();

        document
        .getElementById("status")
        .innerText =
        isoSignsData.length +
        " signs loaded";

    }
    catch(error){

        console.error(error);

        document
        .getElementById("status")
        .innerText =
        error.toString();

    }

}

function renderSigns(){

    const grid =
    document
    .getElementById("grid");

    grid.innerHTML = "";

    isoSignsData.forEach(sign=>{

        const card =
        document.createElement("div");

        card.className =
        "bg-white p-2 rounded shadow";

        const svg =
        sign.svg_url || "";

        card.innerHTML = `

            ${svg}

            <div class="font-bold">

            ${sign.id}

            </div>

            <div>

            ${sign.name}

            </div>

        `;

        grid.appendChild(card);

    });

}

</script>

</body>

</html>
